name: Ballon (Hammer Express) - plugin
on:
  push:
    branches: [ ballon ]
    paths: [ 'ballon/**', '.github/workflows/ballon_plugin.yml' ]
permissions:
  contents: write
concurrency:
  group: ballon-plugin
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Cache outils (cargo-skyline, toolchain Switch)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-skyline
            ~/.cargo/skyline
            ~/.rustup/toolchains/*skyline*
            ~/.cargo/registry
            ~/.cargo/git
            ballon/target
          key: ballon-skyline-v1-${{ hashFiles('ballon/Cargo.toml') }}
          restore-keys: |
            primid-skyline-v1-
            skyline-v1-
      - name: Compiler
        working-directory: ballon
        timeout-minutes: 60
        run: |
          command -v cargo-skyline >/dev/null || cargo install cargo-skyline
          if ! (rustup toolchain list | grep -qi skyline && [ -d ~/.cargo/skyline/toolchain ]); then for i in 1 2 3 4 5; do cargo skyline update-std && break; sleep 20; done; fi
          mkdir -p /tmp/out; rm -f target/aarch64-skyline-switch/release/*.nro
          set +o pipefail; yes | CARGO_TERM_COLOR=never cargo skyline build --release 2>&1 | grep -E -A8 "^error" | head -80; set -o pipefail
          N=$(ls target/aarch64-skyline-switch/release/*.nro | head -1); test -s "$N"; cp "$N" /tmp/out/plugin.nro
      - name: Chiffrer et publier (branche sortie_ballon)
        run: |
          mkdir -p /tmp/pub /tmp/out; openssl rand -out /tmp/k.bin 32
          tar cz -C /tmp/out . | openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin > /tmp/pub/out.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey $GITHUB_WORKSPACE/cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc
          rm -f /tmp/k.bin
          cd /tmp/pub && git init -q -b s && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "ballon plugin chiffre ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" s:sortie_ballon
