name: Recuperer un skin (chiffre, cle du depot + cle de la session)
on:
  push:
    branches: [ metalsonic ]
    paths: [ '.github/workflows/mod-session.yml' ]
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODS: "475923 175208"
      BRANCHE: mod_metal
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger, extraire (rien n'est affiche)
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          mkdir -p /tmp/m/x && cd /tmp/m
          for MOD in $MODS; do
            curl -sSL -A "Mozilla/5.0" -o info_$MOD.json "https://gamebanana.com/apiv11/Mod/$MOD/ProfilePage" || true
            cp info_$MOD.json x/
            python3 -c "import json;[print(f['_idRow'],f['_sDownloadUrl']) for f in json.load(open('info_$MOD.json')).get('_aFiles',[])]" > liens.txt
            while read id url; do
              curl -sSL -A "Mozilla/5.0" -o "f_$id.bin" "$url"
              7z x -y -o"x/$MOD/f_$id" "f_$id.bin" >/dev/null 2>&1 || true; rm -f "f_$id.bin"
            done < liens.txt
          done
          find x -type f | sed 's#^x/##' > x/liste.txt; echo "fichiers : $(wc -l < x/liste.txt)"
      - name: Chiffrer et publier
        env:
          CLE: ${{ secrets.CLE }}
        run: |
          mkdir -p /tmp/pub; tar cz -C /tmp/m x > /tmp/mod.tgz
          printf '%s' "$CLE" > /tmp/k; openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k -in /tmp/mod.tgz | split -b 90m - /tmp/pub/mod.tgz.enc.; rm -f /tmp/k
          openssl rand 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/mod.tgz | split -b 90m - /tmp/pub/mod.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/cle_session.pem" -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/mod.tgz
          cd /tmp/pub && git init -q -b "$BRANCHE" && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "skin chiffre"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCHE"
