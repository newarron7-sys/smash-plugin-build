name: REX - Metal Sonic (recuperation + analyse, chiffre)
on:
  push:
    branches: [ metalsonic ]
    paths: [ '.github/workflows/rex-metal.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metal:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Place
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
      - name: Build REX (Google Drive du proprietaire)
        run: |
          mkdir -p /tmp/w && cd /tmp/w
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          ok=0
          for ID in 1EpUZCpCQTMTYAtrnQCTBgvp6KUAsLo6- 14KJsk4NLN3sRtSq-poawhJkefntOVG7C; do
            for essai in $(seq 1 15); do
              curl -sSL -c ck.txt -A "$UA" "https://drive.google.com/uc?export=download&id=$ID" -o page.html || true
              uuid=$(grep -oE 'name="uuid" value="[^"]+"' page.html | sed 's/.*value="//; s/"$//' || true)
              curl -sSL -b ck.txt -A "$UA" -o rex.rar "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t&uuid=$uuid" || true
              if [ "$(stat -c %s rex.rar 2>/dev/null || echo 0)" -gt 1000000000 ]; then echo "Drive OK"; ok=1; break; fi
              echo "quota (essai $essai)"; rm -f rex.rar; sleep 300
            done
            [ $ok = 1 ] && break
          done
          test -f rex.rar
          sd=$(7z l -ba -slt rex.rar | sed -n 's/^Path = \(.*sd\.raw\)$/\1/p' | head -1)
          7z e -y rex.rar "$sd" -o/tmp/w >/dev/null; rm -f rex.rar; test -f sd.raw
      - name: Extraire Metal Sonic (rien n'est affiche)
        run: |
          cd /tmp/w && mkdir -p /tmp/x/out
          7z l -ba -slt sd.raw | awk '/^Path = /{p=substr($0,8)} /^Size = /{print $3"\t"p}' > /tmp/x/out/liste_sd.txt
          sed -n 's#^[0-9]*\trex_/pf/[Ff]ighter/\([^/]*\)$#\1#p' /tmp/x/out/liste_sd.txt | sort -u > /tmp/x/out/persos_rex.txt
          grep -i metal /tmp/x/out/liste_sd.txt > /tmp/x/out/fichiers_metal.txt || true
          P=$(grep -ix metalsonic /tmp/x/out/persos_rex.txt | head -1)
          echo "dossiers de persos : $(wc -l < /tmp/x/out/persos_rex.txt), Metal trouve : $([ -n "$P" ] && echo oui || echo non)"
          echo "$P" > /tmp/x/out/dossier.txt
          if [ -n "$P" ]; then
            F=$(grep -oiE "rex_/pf/[Ff]ighter/$P" /tmp/x/out/liste_sd.txt | head -1)
            p=$(echo "$P" | tr 'A-Z' 'a-z')
            7z x -y sd.raw "$F/*" "rex_/pf/module/ft_$p.rel" "rex_/pf/module/ft_$P.rel" -o/tmp/x >/dev/null || true
            # tout ce qui porte "metal" (portraits, menus, sons de victoire...)
            cut -f2 /tmp/x/out/fichiers_metal.txt > /tmp/x/l.txt
            7z x -y sd.raw @/tmp/x/l.txt -o/tmp/x >/dev/null || true
            rel=$(ls /tmp/x/rex_/pf/module/ft_$p.rel /tmp/x/rex_/pf/module/ft_$P.rel 2>/dev/null | head -1)
            python3 "$GITHUB_WORKSPACE/rex/tools/analyse_rex.py" "/tmp/x/$F" "$rel" "MetalSonic" > /tmp/x/out/analyse_metal.txt 2>&1 || true
          fi
          rm -f sd.raw /tmp/x/l.txt
          echo "fichiers : $(find /tmp/x -type f | wc -l), taille : $(du -sh /tmp/x | cut -f1)"
      - name: Chiffrer (cle du depot + cle de la session)
        env:
          CLE: ${{ secrets.CLE }}
        run: |
          mkdir -p /tmp/pub && cd /tmp/x
          tar cz -C /tmp/x out > /tmp/rapport.tgz
          tar cz -C /tmp/x . > /tmp/tout.tgz
          printf '%s' "$CLE" > /tmp/k
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k -in /tmp/tout.tgz | split -b 90m - /tmp/pub/metal.tgz.enc.
          rm -f /tmp/k
          openssl rand 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/rapport.tgz -out /tmp/pub/rapport.session.enc
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/tout.tgz | split -b 90m - /tmp/pub/tout.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/cle_session.pem" -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc
          rm -f /tmp/k.bin /tmp/*.tgz; ls /tmp/pub
      - name: Publier (branche rex_metalsonic, chiffre)
        run: |
          cd /tmp/pub && git init -q -b rex_metalsonic && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "rex metal sonic chiffre"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" rex_metalsonic:rex_metalsonic
