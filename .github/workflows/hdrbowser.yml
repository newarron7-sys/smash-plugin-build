name: Dark Bowser - moveset HDR v0.50.10 sur c55 (plugin)
on:
  push:
    branches: [ marioults ]
    paths: [ '.github/workflows/hdrbowser.yml', 'rex/hdrbowser/**' ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hdrbowser
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: wuboyth/skyline-plugin-builder:latest
    defaults:
      run:
        working-directory: rex/hdrbowser
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        run: |
          mkdir -p /tmp/out
          set +e; cargo skyline build --release > /tmp/out/compilation.txt 2>&1; echo "code $?"; set -e
          sed 's/\x1b\[[0-9;]*m//g' /tmp/out/compilation.txt | grep -E -A10 "^error" | head -120 || true
          cp target/aarch64-skyline-switch/release/libhdr_dark_bowser.nro /tmp/out/plugin.nro || true
        env:
          HOME: /root
      - name: Publier (chiffre, cle de la session)
        if: always()
        working-directory: .
        run: |
          git config --global --add safe.directory '*'
          mkdir -p /tmp/pub; tar cz -C /tmp/out . > /tmp/o.tgz
          openssl rand -hex 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/o.tgz | split -b 90m - /tmp/pub/out.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/o.tgz
          cd /tmp/pub && git init -q -b sortie_hdrbowser && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "hdr bowser" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sortie_hdrbowser
