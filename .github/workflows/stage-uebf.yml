name: Stage - Unreal Introduction Map sur le Champ de bataille (variante Stage Alts R)
on:
  push:
    branches: [ marioults ]
    paths:
      - '.github/workflows/stage-uebf.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-uebf
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      MID: '692367'
      BRAWL_CHR0: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar fonts-dejavu-core >/dev/null 2>&1 || true
          pip install ssbh_data_py numpy pillow scipy pyyaml >/dev/null
          mkdir -p /tmp/out/travail
      - name: Page du mod (description)
        run: |
          set +e
          curl -sSL -A "Mozilla/5.0" "https://gamebanana.com/apiv11/Mod/$MID/ProfilePage" -o /tmp/out/page.json
          python3 - <<'PY'
          import json, re, html
          p = json.load(open('/tmp/out/page.json'))
          t = re.sub(r'<[^>]+>', ' ', html.unescape(p.get('_sText', '') or ''))
          open('/tmp/out/page.txt', 'w').write('%s\n%s\n%s\n\n%s\n' % (p.get('_sName'), p.get('_aGame', {}).get('_sName'),
              p.get('_aCategory', {}).get('_sName'), re.sub(r'\s+', ' ', t)))
          print('page ok')
          PY
      - name: Telechargement
        run: |
          python3 -u outils/stagekit/stage/tools/gb_fetch.py mod $MID /tmp/gb > /tmp/out/fichiers.txt 2>&1; wc -l /tmp/out/fichiers.txt
          cp "$(find /tmp/gb/$MID -iname "*DOLPHIN*.pac" | head -1)" /tmp/out/travail/ue.pac
          find /tmp/gb/$MID -iname "*.txt" -print0 | while IFS= read -r -d '' f; do echo "== $f"; head -60 "$f"; done > /tmp/out/lisezmoi.txt 2>&1
          ls /tmp/out/travail | wc -l
      - name: Champ de bataille - HDR, chemins du jeu, outil lvd
        run: |
          set +e
          mkdir -p /tmp/out/refs
          curl -sSL -o /tmp/hashes.txt https://raw.githubusercontent.com/ultimate-research/archive-hashes/master/Hashes_FullPath
          grep "^stage/battlefield/normal/" /tmp/hashes.txt > /tmp/liste_bf.txt; wc -l < /tmp/liste_bf.txt
          cargo install smash-lvd --features cli --root /tmp/lvdtool >/dev/null 2>&1
          mkdir -p /tmp/hdr && cd /tmp/hdr
          curl -sSL -o sp.zip https://github.com/HDR-Development/hdr-prereleases/releases/download/v0.50.10/switch-package.zip
          unzip -qo sp.zip "*hdr-stages/stage/battlefield/normal/*" "*hdr-stages/stage/battlefield/normal_s02/model/floating_plate_sub_set/*" "*hdr-stages/ui/replace/stage/stage_*/stage_*_battlefield.bntx" -d x 2>/dev/null
          find /tmp/hdr/x -type f | sed 's#.*hdr-stages/##' | sort > /tmp/out/refs/hdr_bf.txt; wc -l < /tmp/out/refs/hdr_bf.txt
      - name: Dessous des plates-formes du jeu (mods GameBanana du Champ de bataille)
        run: |
          set +e
          for q in "battlefield" "battlefield retexture" "battlefield no platforms" "battlefield stage" "omega battlefield"; do
            python3 -u outils/stagekit/stage/tools/gb_fetch.py cherche "$q" stage/battlefield/normal/model/floating_plate_sub_set /tmp/bfm 8 > /dev/null 2>&1
          done
          find /tmp/bfm -path "*stage/battlefield/normal/model/floating_plate_sub_set/model.numshb" -print0 | while IFS= read -r -d '' f; do
            echo "$(md5sum < "$f" | cut -c1-12) $(stat -c %s "$f") $f"
          done | sort > /tmp/out/refs/sub_set.txt
          python3 - <<'PY2'
          import collections, ssbh_data_py as S
          L = [l.split(' ', 2) for l in open('/tmp/out/refs/sub_set.txt').read().splitlines() if l]
          c = collections.Counter(x[0] for x in L)
          print('numshb trouvés', len(L), c.most_common(5))
          for h, n in c.most_common():
              f = next(x[2] for x in L if x[0] == h)
              try:
                  m = S.mesh_data.read_mesh(f)
                  noms = [o.name for o in m.objects]
                  print(h, n, noms, [len(o.positions[0].data) for o in m.objects])
                  if noms == ['groupShape111617181364'] * 3:
                      open('/tmp/sub_shb.txt', 'w').write(f)
                      break
              except Exception as e:
                  print(h, 'illisible', e)
          PY2
          cat /tmp/sub_shb.txt 2>/dev/null | sed 's#/tmp/bfm/##' | cut -d/ -f1; true
      - name: Materiau modele (Yoshi's Story 392643, bg2_set)
        run: |
          python3 -u outils/stagekit/stage/tools/gb_fetch.py mod 392643 /tmp/ys > /dev/null 2>&1
          find /tmp/ys -path "*normal/model/bg2_set/model.numatb" | head -1 > /tmp/matl_modele.txt; wc -l < /tmp/matl_modele.txt
      - name: Cache ultimate_tex_cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ultimate_tex_cli
          key: ultimate-tex-cli-v1
      - name: ultimate_tex_cli
        run: test -x ~/.cargo/bin/ultimate_tex_cli || cargo install --locked --git https://github.com/ScanMountGoat/ultimate_tex ultimate_tex_cli 2>&1 | tail -2
      - name: Cache textures HD (x4)
        uses: actions/cache@v4
        with:
          path: /tmp/hd
          key: ue-hd-x4-v1
      - name: Textures HD x4 (Real-ESRGAN x4plus)
        env:
          PP_Y0: '0.0'
          PP_ECHELLE: '1.0'
        run: |
          set -o pipefail
          if [ ! -f /tmp/hd/fini ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision >/dev/null
            pip install spandrel >/dev/null
            curl -sSL -o /tmp/esr.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
            mkdir -p /tmp/hd
            python3 -u outils/stagekit/stage/tools/pp_scene.py textures /tmp/out/travail/ue.pac /tmp/hdsrc > /dev/null 2>&1
            for f in /tmp/hdsrc/*.png; do b=$(basename "$f" .png); python3 -u outils/stagekit/stage/tools/upscale_tex.py /tmp/esr.pth "$f" "/tmp/hd/${b}_x4.png" > /dev/null; done
            touch /tmp/hd/fini
          fi
          ls /tmp/hd | wc -l
      - name: Construction (Unreal en variante normal_s02 du Champ de bataille)
        run: |
          set -o pipefail
          export PATH=$PATH:/tmp/lvdtool/bin:$HOME/.cargo/bin
          HBF=$(find /tmp/hdr/x -type d -path "*hdr-stages/stage/battlefield" | head -1)
          for T in C; do
            M="/tmp/out/mod/$T/(Stage) Unreal Introduction Map (Champ de bataille R)"
            mkdir -p "$M"
            UE_SUB_SHB="$(cat /tmp/sub_shb.txt 2>/dev/null)" UE_TEST=$T UE_HD=/tmp/hd UE_SCENE=/tmp/rendu python3 -u outils/stagekit/stage/tools/ue_bf.py /tmp/out/travail/ue.pac "$HBF" /tmp/liste_bf.txt "$(cat /tmp/matl_modele.txt)" "$M" > /tmp/out/construction_$T.txt 2>&1
            tail -2 /tmp/out/construction_$T.txt | cut -c1-60
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print('partages',len(d['share_to_vanilla']))" "$M/config.json"
          done
      - name: Image de l'ecran des terrains
        env:
          PP_Y0: '0.0'
          PP_ECHELLE: '1.0'
          UI_NOM: battlefield
          UI_SUFFIXE: _s02
          UI_CAM: '27,40,330,27,20,0,34,50'
          UI_FOND: '7fb3e0'
        run: |
          set +e
          export PATH=$PATH:$HOME/.cargo/bin
          npm i --prefix /tmp/rn three@0.160.0 playwright@1.47.2 >/dev/null 2>&1
          (cd /tmp/rn && npx playwright install --with-deps chromium >/dev/null 2>&1)
          R=/tmp/rendu; mkdir -p $R; cp outils/stagekit/stage/tools/rendu/* $R/; cp /tmp/rn/node_modules/three/build/three.module.js $R/
          ls $R/scene.json
          (cd $R && nohup python3 -m http.server 8765 >/dev/null 2>&1 &); sleep 3
          mkdir -p /tmp/refui; for n in 1 2 4; do find /tmp/hdr/x -path "*ui/replace/stage/stage_$n/stage_${n}_battlefield.bntx" -exec cp {} /tmp/refui/ \; ; done; ls /tmp/refui
          M="/tmp/out/mod/C/(Stage) Unreal Introduction Map (Champ de bataille R)"
          NODE_PATH=/tmp/rn/node_modules python3 -u outils/stagekit/stage/tools/ui_pp.py $R /tmp/refui "$M/ui" /tmp/out/ui_apercu > /tmp/out/ui.txt 2>&1
          grep -c "greffé" /tmp/out/ui.txt; find "$M/ui" -type f | sed "s#$M/##"
          (cd $R && NODE_PATH=/tmp/rn/node_modules UI_FOND=7fb3e0 node rendu.js /tmp/out/apercu_recule.png 1280 720 27 60 520 27 20 0 40 > /dev/null 2>&1)
          (cd $R && NODE_PATH=/tmp/rn/node_modules UI_FOND=7fb3e0 node rendu.js /tmp/out/apercu_recule_bas.png 1280 720 27 20 260 27 10 0 40 > /dev/null 2>&1)
          (cd /tmp/out/mod && find . -type f | sort > /tmp/out/mod_liste.txt)
          true
      - name: Chiffrer (cle de la session) et publier
        if: always()
        run: |
          mkdir -p /tmp/pub; tar cz -C /tmp/out . > /tmp/o.tgz
          openssl rand -hex 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/o.tgz | split -b 90m - /tmp/pub/out.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/o.tgz
          cd /tmp/pub && git init -q -b sortie_uebf && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "uebf" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sortie_uebf
