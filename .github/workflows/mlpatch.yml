name: Dark Bowser - motion_list c55 (base + motion_patch HDR v0.50.10, chiffre)
on:
  push:
    branches: [ marioults ]
    paths: [ '.github/workflows/mlpatch.yml', 'rex/tools/mlpatch/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Construire l'outil
        working-directory: rex/tools/mlpatch
        run: cargo build --release 2>&1 | tail -30
      - name: Sources (Ult S pour la base Bowser, HDR v0.50.10 pour le patch) et motion_list
        run: |
          mkdir -p /tmp/o
          git clone -q --depth 1 https://github.com/chrispo-git/ult-s /tmp/ults
          git clone -q --depth 1 -b v0.50.10 https://github.com/HDR-Development/HewDraw-Remix /tmp/hdr
          T=rex/tools/mlpatch/target/release/mlpatch
          # Dark Bowser : un seul jab = le 2e jab vanilla (motion attack_11 -> animation et scripts d'attack_12, pas d'enchaînement)
          python3 - <<'EOP'
          p = '/tmp/hdr/romfs/source/fighter/koopa/motion/body/motion_patch.yaml'
          s = open(p).read()
          old = "attack_11:\n  flags:\n    move: false\n  extra:\n    cancel_frame: 20\n"
          assert s.count(old) == 1, 'bloc attack_11 introuvable'
          f = ''.join(f"    {k}: {'true' if k == 'unk_80' else 'false'}\n" for k in
                      ['turn', 'loop', 'move', 'fix_trans', 'fix_rot', 'fix_scale', 'unk_40', 'unk_80', 'unk_100',
                       'unk_200', 'unk_400', 'unk_800', 'unk_1000', 'unk_2000'])
          new = ("attack_11:\n  game_script: game_attack12\n  flags:\n" + f + "  blend_frames: 0\n"
                 "  animations:\n    - name: c00attack12.nuanmb\n"
                 "  scripts:\n    - expression_attack12\n    - sound_attack12\n    - effect_attack12\n"
                 "  extra:\n    xlu_start: 0\n    xlu_end: 0\n    cancel_frame: 26\n    no_stop_intp: false\n")
          s = s.replace(old, new)
          # smash bas : carapace qui tourne (animation du haut B au sol)
          old2 = "attack_lw4:\n  extra:\n    cancel_frame: 58\n"
          assert s.count(old2) == 1, 'bloc attack_lw4 introuvable'
          new2 = ("attack_lw4:\n  game_script: game_attacklw4\n  flags:\n" + f + "  blend_frames: 0\n"
                  "  animations:\n    - name: d02specialhi.nuanmb\n"
                  "  scripts:\n    - expression_attacklw4\n    - sound_specialhi\n    - effect_specialhi\n"
                  "  extra:\n    xlu_start: 0\n    xlu_end: 0\n    cancel_frame: 82\n    no_stop_intp: true\n")
          s = s.replace(old2, new2)
          # side B = Koopa Punch : la ruée est gérée par le plugin (pas de déplacement par l'animation)
          for m in ['special_s_catch', 'special_s_air_catch']:
              o = m + ":\n  flags:\n    move: true\n  extra:\n    cancel_frame: 60\n"
              assert s.count(o) == 1, 'bloc ' + m + ' introuvable'
              s = s.replace(o, m + ":\n  flags:\n    move: false\n  extra:\n    cancel_frame: 70\n")
          # lancers normaux = les 3 lancers du side B HDR (avant, arrière, bas) ; le lancer haut reste celui d'HDR
          for m, d, cf, mv in [('throw_f', 'f', 36, 'true'), ('throw_b', 'b', 44, 'false'), ('throw_lw', 'lw', 40, 'false')]:
              o = {'throw_f': "throw_f:\n  extra:\n    cancel_frame: 49\n", 'throw_b': "throw_b:\n  extra:\n    cancel_frame: 32\n",
                   'throw_lw': "throw_lw:\n  extra:\n    cancel_frame: 60\n"}[m]
              assert s.count(o) == 1, 'bloc ' + m + ' introuvable'
              fl = f.replace("    move: false\n", "    move: " + mv + "\n")
              n = (m + ":\n  game_script: game_throw" + m.split('_')[1] + "\n  flags:\n" + fl + "  blend_frames: 0\n"
                   "  animations:\n    - name: d01specialsthrow" + d + ".nuanmb\n"
                   "  scripts:\n    - expression_specialsthrow" + d + "\n    - sound_specialsthrow" + d + "\n    - effect_specialsthrow" + d + "\n"
                   "  extra:\n    xlu_start: 0\n    xlu_end: 0\n    cancel_frame: " + str(cf) + "\n    no_stop_intp: false\n")
              s = s.replace(o, n)
          # saut : HDR remplace l'accroupissement par l'animation d'atterrissage lourd (longue) -> on garde celle du jeu
          o = "jump_squat:\n  blend_frames: 0\n  animations:\n  - name: a05landingheavy.nuanmb\n"
          assert s.count(o) == 1, 'bloc jump_squat introuvable'
          s = s.replace(o, "")
          # smash haut : Bowser en boule (animation en boule du nair)
          o = "attack_hi4:\n  extra:\n    cancel_frame: 60\n"
          assert s.count(o) == 1, 'bloc attack_hi4 introuvable'
          s = s.replace(o, "attack_hi4:\n  game_script: game_attackhi4\n  flags:\n" + f + "  blend_frames: 0\n"
                        "  animations:\n    - name: c05attackairn.nuanmb\n"
                        "  scripts:\n    - expression_attackhi4\n    - sound_attackhi4\n    - effect_attackhi4\n"
                        "  extra:\n    xlu_start: 0\n    xlu_end: 0\n    cancel_frame: 46\n    no_stop_intp: false\n")
          open(p, 'w').write(s)
          EOP
          cp /tmp/hdr/romfs/source/fighter/koopa/motion/body/motion_patch.yaml /tmp/o/body_motion_patch.yaml
          for p in body breath; do
            b=/tmp/ults/romfs/fighter/koopa/motion/$p/c00/motion_list.bin
            [ -f $b ] || { echo "pas de base pour $p"; ls /tmp/ults/romfs/fighter/koopa/motion/; continue; }
            $T $b /tmp/hdr/romfs/source/fighter/koopa/motion/$p/motion_patch.yaml /tmp/o/${p}_motion_list.bin /tmp/o/${p}_avant.yaml /tmp/o/${p}_apres.yaml 2>&1 | tail -5
          done
          ls -la /tmp/o
      - name: Chiffrer (cle de la session) et publier
        run: |
          mkdir -p /tmp/pub; tar cz -C /tmp/o . > /tmp/o.tgz
          openssl rand -hex 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/o.tgz | split -b 90m - /tmp/pub/out.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/o.tgz
          cd /tmp/pub && git init -q -b sortie_mlpatch && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "mlpatch" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sortie_mlpatch
