name: Metal Sonic (REX) sur Sonic c08-c15 - modele, coups, animations (chiffre)
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/metal.yml' ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metal
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VARIANTE: MetalSonicProportionEdit
      COSTUME: c07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Outils
        run: pip install ssbh_data_py numpy pillow scipy >/dev/null; mkdir -p /tmp/out /tmp/w /tmp/ref/ref
      - name: Fichiers REX et skin (branches chiffrees, rien n'est affiche)
        env:
          CLE: ${{ secrets.CLE }}
        run: |
          printf '%s' "$CLE" > /tmp/k
          for b in rex_metalsonic mod_metal; do git fetch -q --depth 1 origin $b:refs/remotes/origin/$b; done
          for f in $(git ls-tree --name-only origin/rex_metalsonic | grep '^metal.tgz.enc'); do git show origin/rex_metalsonic:$f; done | openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/k | tar xz -C /tmp/w
          mkdir -p /tmp/skin; for f in $(git ls-tree --name-only origin/mod_metal | grep '^mod.tgz.enc'); do git show origin/mod_metal:$f; done | openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/k | tar xz -C /tmp/skin
          rm -f /tmp/k
          S=$(find /tmp/skin -type d -path "*$VARIANTE/fighter/sonic/model/body/$COSTUME" | head -1); echo "skin trouve : $([ -n "$S" ] && echo oui || echo non)"
          cp "$S"/* /tmp/ref/ref/; echo "$S" > /tmp/skin_dir.txt
          ls /tmp/w/rex_/pf/Fighter/metalsonic | wc -l
      - name: Modele (paires d'os REX -> Sonic)
        run: |
          D=/tmp/w/rex_/pf/Fighter/metalsonic
          EXO=1 DROP_VIS=OutlineM python3 rex/tools/build_model_rex.py $D/FitMetalSonic00.pac /tmp/ref/ref /tmp/out metalsonic > /tmp/out/build.txt 2>&1; tail -5 /tmp/out/build.txt | grep -oE '^[A-Za-z]*Error.*' || true; test -f /tmp/out/model.json
      - name: Coups (generated.rs)
        run: |
          D=/tmp/w/rex_/pf/Fighter/metalsonic
          python3 rex/tools/hit_keys.py /tmp/out /tmp/out/hit_keys.json > /tmp/out/hit_keys.txt 2>&1
          HIT_KEYS=/tmp/out/hit_keys.json RATE=1 BODY=1 SUIVRE=1 python3 rex/tools/gen_rex.py $D/FitMetalSonic.pac $D/FitMetalSonicMotionEtc.pac $D/FitMetalSonic00.pac /tmp/out/generated.rs > /tmp/out/generation.txt 2>&1; wc -l /tmp/out/generated.rs
      - name: Animations (base + coups, squelette de Sonic)
        run: |
          D=/tmp/w/rex_/pf/Fighter/metalsonic
          SCALE=1 NO_EXO=1 python3 rex/tools/retarget_exo.py $D/FitMetalSonic00.pac $D/FitMetalSonicMotionEtc.pac /tmp/out /tmp/out/motion/c00 shadow_base rex/tools/dolly_motions.txt > /tmp/out/animations.txt 2>&1 || true
          SCALE=1 NO_EXO=1 python3 rex/tools/retarget_exo.py $D/FitMetalSonic00.pac $D/FitMetalSonicMotionEtc.pac /tmp/out /tmp/out/motion/c00 shadow_coups >> /tmp/out/animations.txt 2>&1 || true
          echo "animations : $(ls /tmp/out/motion/c00/*.nuanmb 2>/dev/null | wc -l)"
      - name: Cache outils (cargo-skyline, toolchain Switch)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-skyline
            ~/.cargo/skyline
            ~/.rustup/toolchains/*skyline*
            ~/.cargo/registry
            ~/.cargo/git
            rex/metalsonic/target
          key: metal-v1-${{ hashFiles('rex/metalsonic/Cargo.toml') }}
          restore-keys: |
            metal-
            chief-
      - name: Compiler le plugin
        working-directory: rex/metalsonic
        timeout-minutes: 40
        run: |
          cp /tmp/out/generated.rs src/generated.rs
          command -v cargo-skyline >/dev/null || cargo install cargo-skyline
          if ! (rustup toolchain list | grep -qi skyline && [ -d ~/.cargo/skyline/toolchain ]); then for i in 1 2 3 4 5; do cargo skyline update-std && break; sleep 20; done; fi
          set +o pipefail; yes | cargo skyline build --release > /tmp/out/compilation.txt 2>&1; set -o pipefail
          grep -E "^error" /tmp/out/compilation.txt | head -20 || true
          rm -f src/generated.rs
          test -f target/aarch64-skyline-switch/release/libmetal_sonic.nro
      - name: Dossier du mod (skin sur les 8 costumes de Sonic + animations + plugin) et zip
        run: |
          V=$(dirname $(dirname $(dirname $(dirname $(dirname $(cat /tmp/skin_dir.txt))))))
          M="/tmp/zip/(Moveset) Metal Sonic"; mkdir -p "$M"
          cp -r "$V"/. "$M"/
          MO="$M/fighter/sonic/motion/body/c00"; mkdir -p "$MO"; cp /tmp/out/motion/c00/*.nuanmb "$MO/"
          cp rex/metalsonic/target/aarch64-skyline-switch/release/libmetal_sonic.nro "$M/plugin.nro"
          cd /tmp/zip && zip -qr /tmp/out/metal_sonic.zip . && echo "zip : $(du -h /tmp/out/metal_sonic.zip | cut -f1), fichiers : $(find /tmp/zip -type f | wc -l)"
          find /tmp/zip -type f | sed 's#^/tmp/zip/##' > /tmp/out/contenu_zip.txt
      - name: Chiffrer (cle du depot + cle de la session) et publier
        if: always()
        env:
          CLE: ${{ secrets.CLE }}
        run: |
          mkdir -p /tmp/pub; tar cz -C /tmp/out . > /tmp/o.tgz
          printf '%s' "$CLE" > /tmp/k; openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k -in /tmp/o.tgz | split -b 90m - /tmp/pub/metal_out.tgz.enc.; rm -f /tmp/k
          openssl rand 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/o.tgz | split -b 90m - /tmp/pub/out.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/o.tgz
          cd /tmp/pub && git init -q -b sortie_metal && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "metal sonic sortie chiffree"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" sortie_metal
