name: Stage - Planet Papetoon sur Yoshi's Story (usage perso)
on:
  push:
    branches: [ marioults ]
    paths:
      - 'outils/stagekit/**'
      - '.github/workflows/stage-papetoon.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-papetoon
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar fonts-dejavu-core >/dev/null 2>&1 || true
          pip install ssbh_data_py numpy pillow scipy >/dev/null
          mkdir -p /tmp/out/travail
      - name: Stage Brawl Planet Papetoon (GameBanana 395060)
        run: |
          python3 -u outils/stagekit/stage/tools/gb_fetch.py mod 395060 /tmp/pp 2>&1 | tee /tmp/out/pp_fichiers.txt | head -5
          cp "$(find /tmp/pp -iname 'STGPAPETOON.pac' | head -1)" /tmp/out/travail/
      - name: Analyse du stage Brawl (modeles, apercu de face)
        run: |
          set +e
          python3 -u outils/stagekit/stage/tools/analyse_brawl_stage.py /tmp/out/travail/STGPAPETOON.pac /tmp/out/apercu_papetoon.png "Planet Papetoon" -56,56,0 > /tmp/out/analyse.txt 2>&1
          tail -60 /tmp/out/analyse.txt
      - name: References Ultimate de Yoshi's Story (stage/yoshi_cartboard)
        run: |
          set +e +o pipefail
          for q in "yoshi's story" "yoshis story" "yoshi story" "yoshi's story stage" "yoshi's story retexture"; do
            python3 -u outils/stagekit/stage/tools/gb_fetch.py cherche "$q" stage/yoshi_cartboard /tmp/ref 6 2>&1 | tail -4
          done
          find /tmp/ref -type d -path "*stage/yoshi_cartboard" -print0 2>/dev/null | while IFS= read -r -d '' d; do
            id=$(echo "$d" | sed -E 's#/tmp/ref/([0-9]+)/.*#\1#'); n=$(echo "$d" | md5sum | cut -c1-6)
            mkdir -p "/tmp/out/travail/ref_${id}_$n" && cp -r "$d" "/tmp/out/travail/ref_${id}_$n/"
            echo "$d" > "/tmp/out/travail/ref_${id}_$n/source.txt"
            find "$d" -type f | sed "s#$d/##" | sort > "/tmp/out/travail/ref_${id}_$n/liste.txt"
            echo "== ref $id $n : $(wc -l < "/tmp/out/travail/ref_${id}_$n/liste.txt") fichiers, lvd $(grep -c lvd "/tmp/out/travail/ref_${id}_$n/liste.txt")"
          done
          find /tmp/ref -maxdepth 4 -name "config.json" -print0 | while IFS= read -r -d '' c; do id=$(echo "$c" | sed -E 's#/tmp/ref/([0-9]+)/.*#\1#'); cp "$c" "/tmp/out/travail/config_$id.json"; done
          find /tmp/ref -ipath "*ui/replace*/stage/stage_*" -iname "*yoshi_cartboard*" -type f | head -20 > /tmp/out/ref_ui.txt
          du -sh /tmp/out/travail
          true
      - name: Inspection des refs (modeles, materiaux)
        run: |
          set +e
          for id in 392643 590120 309999 353126; do
            d=$(find /tmp/ref/$id -type d -path "*stage/yoshi_cartboard" | head -1)
            [ -n "$d" ] && python3 outils/stagekit/stage/tools/inspect_ref.py "$d" > /tmp/out/inspect_$id.txt 2>&1
            echo "== $id $(wc -l < /tmp/out/inspect_$id.txt)"
          done
          true
      - name: Collisions de Yoshi's Story (yoshi_cartboard_00.lvd) - refs + HDR, en yaml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e +o pipefail
          cargo install smash-lvd --features cli --root /tmp/lvdtool >/dev/null 2>&1; ls /tmp/lvdtool/bin
          mkdir -p /tmp/out/lvd /tmp/hdr && cd /tmp/hdr
          curl -sSL -o hdr.zip https://github.com/HDR-Development/HewDraw-Remix/releases/download/v0.50.10/hdr-switch.zip
          curl -sSL -o sp.zip https://github.com/HDR-Development/hdr-prereleases/releases/download/v0.50.10/switch-package.zip
          for z in hdr.zip sp.zip; do unzip -l $z | grep -i yoshi_cartboard | head; unzip -qo $z "*yoshi_cartboard*" -d x_$z 2>/dev/null; done
          find /tmp/ref /tmp/hdr -iname "yoshi_cartboard*.lvd" -print0 | while IFS= read -r -d '' f; do
            n=$(md5sum "$f" | cut -c1-8); cp "$f" /tmp/out/lvd/$n.lvd; echo "$f" > /tmp/out/lvd/$n.txt
            /tmp/lvdtool/bin/yamlvd "$f" /tmp/out/lvd/$n.yml 2>&1 | tail -2; echo "== $n $f"
          done
          true
      - name: Cache ultimate_tex_cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ultimate_tex_cli
          key: ultimate-tex-cli-v1
      - name: ultimate_tex_cli
        run: test -x ~/.cargo/bin/ultimate_tex_cli || cargo install --locked --git https://github.com/ScanMountGoat/ultimate_tex ultimate_tex_cli 2>&1 | tail -2
      - name: Cache textures HD (x4)
        uses: actions/cache@v4
        with:
          path: /tmp/hd
          key: papetoon-hd-x4-v1
      - name: Textures HD x4 (Real-ESRGAN x4plus, comme COT)
        run: |
          set -o pipefail
          if [ ! -f /tmp/hd/fini ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision >/dev/null
            pip install spandrel >/dev/null
            curl -sSL -o /tmp/esr.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
            mkdir -p /tmp/hd
            python3 -u outils/stagekit/stage/tools/pp_scene.py textures /tmp/out/travail/STGPAPETOON.pac /tmp/hdsrc 2>&1 | grep -v "^texture"
            for f in /tmp/hdsrc/*.png; do b=$(basename "$f" .png); python3 -u outils/stagekit/stage/tools/upscale_tex.py /tmp/esr.pth "$f" "/tmp/hd/${b}_x4.png"; done
            touch /tmp/hd/fini
          fi
          ls -la /tmp/hd | head -30
      - name: Construction du stage (Papetoon sur Yoshi's Story)
        run: |
          set -o pipefail
          pip install pyyaml >/dev/null
          export PATH=$PATH:/tmp/lvdtool/bin:$HOME/.cargo/bin
          REF=$(find /tmp/ref/392643 -type d -path "*stage/yoshi_cartboard" | head -1)
          LVD=$(find /tmp/hdr -path "*hdr-stages/stage/yoshi_cartboard/normal/param/yoshi_cartboard_00.lvd" | head -1)
          M="/tmp/out/mod/(Stage) Planet Papetoon (Yoshi's Story)"
          mkdir -p "$M"
          python3 -u outils/stagekit/stage/tools/brawl_coll.py /tmp/out/travail/STGPAPETOON.pac > /tmp/out/collisions_brawl.txt 2>&1 || true
          PP_HD=/tmp/hd python3 -u outils/stagekit/stage/tools/papetoon_ys.py /tmp/out/travail/STGPAPETOON.pac "$REF" "$LVD" "$M" 2>&1 | tee /tmp/out/construction.txt | tail -40
          find "$M" -type f | sed "s#$M/##" | sort > /tmp/out/mod_liste.txt; wc -l /tmp/out/mod_liste.txt; du -sh "$M"
          rm -rf /tmp/out/travail/ref_*
          python3 -u outils/stagekit/stage/tools/apercu_pp.py /tmp/out/travail/STGPAPETOON.pac "$M/stage/yoshi_cartboard/normal/param/yoshi_cartboard_00.lvd" /tmp/out/apercu_jeu.png 2>&1 | tail -3
      - name: Image de l'ecran des terrains (rendu three.js + greffe dans les bntx de reference)
        run: |
          set +e
          export PATH=$PATH:$HOME/.cargo/bin
          npm i --prefix /tmp/rn three@0.160.0 playwright@1.47.2 >/dev/null 2>&1
          (cd /tmp/rn && npx playwright install --with-deps chromium >/dev/null 2>&1)
          R=/tmp/rendu; mkdir -p $R; cp outils/stagekit/stage/tools/rendu/* $R/; cp /tmp/rn/node_modules/three/build/three.module.js $R/
          python3 -u outils/stagekit/stage/tools/pp_scene.py scene /tmp/out/travail/STGPAPETOON.pac /tmp/hd $R 2>&1 | grep -v "^texture" | tail -2
          (cd $R && nohup python3 -m http.server 8765 >/dev/null 2>&1 &); sleep 3
          mkdir -p /tmp/refui; find /tmp/ref/590120 -ipath "*ui/replace*/stage/stage_*" -name "stage_*_yoshi_cartboard.bntx" -exec cp {} /tmp/refui/ \; ; ls -la /tmp/refui
          M="/tmp/out/mod/(Stage) Planet Papetoon (Yoshi's Story)"
          NODE_PATH=/tmp/rn/node_modules python3 -u outils/stagekit/stage/tools/ui_pp.py $R /tmp/refui "$M/ui" /tmp/out/ui_apercu
          find "$M/ui" -type f; ls /tmp/out/ui_apercu
          true
      - name: Chiffrer (cle de la session) et publier
        if: always()
        run: |
          mkdir -p /tmp/pub; tar cz -C /tmp/out . > /tmp/o.tgz
          openssl rand -hex 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/o.tgz | split -b 90m - /tmp/pub/out.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/o.tgz
          cd /tmp/pub && git init -q -b sortie_papetoon && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "papetoon" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sortie_papetoon
