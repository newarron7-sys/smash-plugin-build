name: Stage - Unreal Introduction Map (GameBanana 692367, usage perso) - analyse
on:
  push:
    branches: [ marioults ]
    paths:
      - '.github/workflows/stage-ue.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-ue
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      MID: '692367'
      BRAWL_CHR0: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar fonts-dejavu-core >/dev/null 2>&1 || true
          pip install ssbh_data_py numpy pillow scipy pyyaml >/dev/null
          mkdir -p /tmp/out/travail
      - name: Page du mod (description)
        run: |
          set +e
          curl -sSL -A "Mozilla/5.0" "https://gamebanana.com/apiv11/Mod/$MID/ProfilePage" -o /tmp/out/page.json
          python3 - <<'PY'
          import json, re, html
          p = json.load(open('/tmp/out/page.json'))
          t = re.sub(r'<[^>]+>', ' ', html.unescape(p.get('_sText', '') or ''))
          open('/tmp/out/page.txt', 'w').write('%s\n%s\n%s\n\n%s\n' % (p.get('_sName'), p.get('_aGame', {}).get('_sName'),
              p.get('_aCategory', {}).get('_sName'), re.sub(r'\s+', ' ', t)))
          print('page ok')
          PY
      - name: Telechargement
        run: |
          python3 -u outils/stagekit/stage/tools/gb_fetch.py mod $MID /tmp/gb > /tmp/out/fichiers.txt 2>&1; wc -l /tmp/out/fichiers.txt
          cp "$(find /tmp/gb/$MID -iname "*DOLPHIN*.pac" | head -1)" /tmp/out/travail/ue.pac
          find /tmp/gb/$MID -iname "*.txt" -print0 | while IFS= read -r -d '' f; do echo "== $f"; head -60 "$f"; done > /tmp/out/lisezmoi.txt 2>&1
          ls /tmp/out/travail | wc -l
      - name: Destination Finale - refs, chemins du jeu, lvd HDR
        run: |
          set +e
          mkdir -p /tmp/out/refs /tmp/out/lvd
          python3 -u outils/stagekit/stage/tools/gb_fetch.py mod 454060 /tmp/ref > /tmp/out/refs/fd454060.txt 2>&1
          for q in "final destination" "final destination retexture" "final destination stage"; do
            python3 -u outils/stagekit/stage/tools/gb_fetch.py cherche "$q" stage/end/ /tmp/ref 6 > /dev/null 2>&1
          done
          find /tmp/ref -type f | sed 's#/tmp/ref/##' > /tmp/out/refs/tous.txt
          find /tmp/ref -maxdepth 4 -name "config.json" -print0 | while IFS= read -r -d '' c; do id=$(echo "$c" | sed -E 's#/tmp/ref/([0-9]+)/.*#\1#'); cp "$c" "/tmp/out/refs/config_$id.json"; done
          curl -sSL -o /tmp/hashes.txt https://raw.githubusercontent.com/ultimate-research/archive-hashes/master/Hashes_FullPath
          grep "^stage/end/" /tmp/hashes.txt > /tmp/out/refs/hashes_end.txt; grep "^ui/replace/stage/stage_[0-9]/stage_[0-9]_end" /tmp/hashes.txt >> /tmp/out/refs/hashes_end.txt; wc -l < /tmp/out/refs/hashes_end.txt
          cargo install smash-lvd --features cli --root /tmp/lvdtool >/dev/null 2>&1
          mkdir -p /tmp/hdr && cd /tmp/hdr
          curl -sSL -o sp.zip https://github.com/HDR-Development/hdr-prereleases/releases/download/v0.50.10/switch-package.zip
          unzip -qo sp.zip "*hdr-stages/stage/end/*" "*hdr-stages/stage/battlefield/normal/param/*" -d x 2>/dev/null
          find /tmp/hdr/x -type f | sed 's#/tmp/hdr/x/##' > /tmp/out/lvd/hdr_fichiers.txt
          find /tmp/ref /tmp/hdr/x -iname "*.lvd" -print0 | while IFS= read -r -d '' f; do
            n=$(echo "$f" | md5sum | cut -c1-8); echo "$f" > /tmp/out/lvd/$n.txt; /tmp/lvdtool/bin/yamlvd "$f" /tmp/out/lvd/$n.yml > /dev/null 2>&1
          done
          ls /tmp/out/lvd | wc -l
      - name: Materiau modele (Yoshi's Story 392643, bg2_set)
        run: |
          python3 -u outils/stagekit/stage/tools/gb_fetch.py mod 392643 /tmp/ys > /dev/null 2>&1
          find /tmp/ys -path "*normal/model/bg2_set/model.numatb" | head -1 > /tmp/matl_modele.txt; wc -l < /tmp/matl_modele.txt
      - name: Cache ultimate_tex_cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ultimate_tex_cli
          key: ultimate-tex-cli-v1
      - name: ultimate_tex_cli
        run: test -x ~/.cargo/bin/ultimate_tex_cli || cargo install --locked --git https://github.com/ScanMountGoat/ultimate_tex ultimate_tex_cli 2>&1 | tail -2
      - name: Cache textures HD (x4)
        uses: actions/cache@v4
        with:
          path: /tmp/hd
          key: ue-hd-x4-v1
      - name: Textures HD x4 (Real-ESRGAN x4plus)
        env:
          PP_Y0: '0.0'
          PP_ECHELLE: '1.0'
        run: |
          set -o pipefail
          if [ ! -f /tmp/hd/fini ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision >/dev/null
            pip install spandrel >/dev/null
            curl -sSL -o /tmp/esr.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
            mkdir -p /tmp/hd
            python3 -u outils/stagekit/stage/tools/pp_scene.py textures /tmp/out/travail/ue.pac /tmp/hdsrc > /dev/null 2>&1
            for f in /tmp/hdsrc/*.png; do b=$(basename "$f" .png); python3 -u outils/stagekit/stage/tools/upscale_tex.py /tmp/esr.pth "$f" "/tmp/hd/${b}_x4.png" > /dev/null; done
            touch /tmp/hd/fini
          fi
          ls /tmp/hd | wc -l
      - name: Construction (Unreal Introduction Map sur la Destination Finale)
        run: |
          set -o pipefail
          export PATH=$PATH:/tmp/lvdtool/bin:$HOME/.cargo/bin
          REF=$(find /tmp/ref/454060 -type d -path "*stage/end" | head -1)
          LVD=$(find /tmp/hdr/x -path "*hdr-stages/stage/battlefield/normal/param/battlefield_00.lvd" | head -1)
          M="/tmp/out/mod/(Stage) Unreal Introduction Map (Destination Finale)"
          mkdir -p "$M"
          UE_HD=/tmp/hd UE_SCENE=/tmp/rendu python3 -u outils/stagekit/stage/tools/ue_fd.py /tmp/out/travail/ue.pac "$REF" /tmp/out/refs/config_454060.json "$(cat /tmp/matl_modele.txt)" "$LVD" "$M" > /tmp/out/construction.txt 2>&1
          tail -3 /tmp/out/construction.txt | cut -c1-60
          find "$M" -type f | sed "s#$M/##" | sort > /tmp/out/mod_liste.txt; wc -l < /tmp/out/mod_liste.txt; du -sh "$M"
      - name: Image de l'ecran des terrains
        env:
          PP_Y0: '0.0'
          PP_ECHELLE: '1.0'
          UI_NOM: end
          UI_CAM: '27,40,330,27,20,0,34,50'
          UI_FOND: '7fb3e0'
        run: |
          set +e
          export PATH=$PATH:$HOME/.cargo/bin
          npm i --prefix /tmp/rn three@0.160.0 playwright@1.47.2 >/dev/null 2>&1
          (cd /tmp/rn && npx playwright install --with-deps chromium >/dev/null 2>&1)
          R=/tmp/rendu; mkdir -p $R; cp outils/stagekit/stage/tools/rendu/* $R/; cp /tmp/rn/node_modules/three/build/three.module.js $R/
          ls $R/scene.json
          (cd $R && nohup python3 -m http.server 8765 >/dev/null 2>&1 &); sleep 3
          mkdir -p /tmp/refui; find /tmp/ref/454060 -ipath "*ui/replace*/stage/stage_*" -name "stage_*_end.bntx" -exec cp {} /tmp/refui/ \; ; ls /tmp/refui | wc -l
          M="/tmp/out/mod/(Stage) Unreal Introduction Map (Destination Finale)"
          NODE_PATH=/tmp/rn/node_modules python3 -u outils/stagekit/stage/tools/ui_pp.py $R /tmp/refui "$M/ui" /tmp/out/ui_apercu > /tmp/out/ui.txt 2>&1
          grep -c "greffé" /tmp/out/ui.txt
          # aperçus caméra reculée (comme quand les persos sont éloignés), vue de face et un peu de haut
          (cd $R && NODE_PATH=/tmp/rn/node_modules UI_FOND=7fb3e0 node rendu.js /tmp/out/apercu_recule.png 1280 720 27 60 520 27 20 0 40 > /dev/null 2>&1)
          (cd $R && NODE_PATH=/tmp/rn/node_modules UI_FOND=7fb3e0 node rendu.js /tmp/out/apercu_recule_bas.png 1280 720 27 20 260 27 10 0 40 > /dev/null 2>&1)
          ls /tmp/out/apercu_recule*.png
          true
      - name: Chiffrer (cle de la session) et publier
        if: always()
        run: |
          mkdir -p /tmp/pub; tar cz -C /tmp/out . > /tmp/o.tgz
          openssl rand -hex 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/o.tgz | split -b 90m - /tmp/pub/out.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/o.tgz
          cd /tmp/pub && git init -q -b sortie_ue && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "ue" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sortie_ue
