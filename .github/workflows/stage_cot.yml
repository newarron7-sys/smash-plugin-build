name: Stage COT (usage perso, sortie chiffree)
on:
  push:
    branches: [ stage_cot ]
    paths:
      - '.github/workflows/stage_cot.yml'
      - 'outils/stage/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-cot
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          mkdir -p /tmp/out/travail
      - name: Collisions d'origine de la Destination Finale (end_00.lvd)
        run: |
          for q in "final destination walk off" "walk off" "walkoff" "final destination walls" "fd extended" "final destination lvd" "omega walk off" "final destination collision" "longer final destination" "big final destination"; do
            python3 -u outils/stage/gb_fetch.py cherche "$q" stage/end/normal/param/end_00.lvd /tmp/lvd 8 2>&1 | tail -3 || true
          done
          find /tmp/lvd -iname "end_00.lvd" -print0 | while IFS= read -r -d '' f; do
            n=$(md5sum "$f" | cut -c1-8); cp "$f" "/tmp/out/travail/end_$n.lvd"; echo "$f" >> "/tmp/out/travail/end_$n.txt"; echo "== $n $f"
          done
      - name: Chiffrer et publier (branche sortie_stage_cot)
        if: always()
        run: |
          mkdir -p /tmp/pub; openssl rand -out /tmp/k.bin 32
          tar cz -C /tmp/out . | openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin > /tmp/pub/out.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey $GITHUB_WORKSPACE/cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc
          cd /tmp/pub && git init -q -b s && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "stage cot ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" s:sortie_stage_cot
