name: Stage COT (usage perso, sortie chiffree)
on:
  push:
    branches: [ stage_cot ]
    paths:
      - '.github/workflows/stage_cot.yml'
      - 'outils/stage/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-cot
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          mkdir -p /tmp/out/travail
      - name: Stage Alts (GameBanana 460711) - mode d'emploi
        run: |
          set +e +o pipefail
          curl -sL "https://gamebanana.com/apiv11/Mod/460711?_csvProperties=_sName,_sText,_sVersion" | python3 -c "import json,sys,re,html;d=json.load(sys.stdin);print(d.get('_sName'),d.get('_sVersion'));print(html.unescape(re.sub('<[^>]+>','\n',d.get('_sText',''))))"
          curl -sL "https://gamebanana.com/apiv11/Mod/460711/Updates?_nPage=1&_nPerpage=5" | head -c 3000; echo
          python3 -u outils/stage/gb_fetch.py mod 460711 /tmp/sa 2>&1 | head -30
          find /tmp/sa -type f | grep -v archives | head -60
          find /tmp/sa -type f \( -iname "*.txt" -o -iname "*.md" -o -iname "*.toml" -o -iname "*.json" \) -print0 | while IFS= read -r -d '' f; do echo "### $f"; head -80 "$f"; done
          mkdir -p /tmp/out/sa && find /tmp/sa -type f -not -path "*archives*" -not -iname "*.nutexb" -print0 | xargs -0 -I{} cp --parents {} /tmp/out/sa/ 2>/dev/null
          true
      - name: Chiffrer et publier (branche sortie_stage_cot)
        if: always()
        run: |
          mkdir -p /tmp/pub; openssl rand -out /tmp/k.bin 32
          tar cz -C /tmp/out . | openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin > /tmp/pub/out.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey $GITHUB_WORKSPACE/cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc
          cd /tmp/pub && git init -q -b s && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "stage cot ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" s:sortie_stage_cot
