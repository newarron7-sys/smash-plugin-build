name: Stage COT (usage perso, sortie chiffree)
on:
  push:
    branches: [ stage_cot ]
    paths:
      - '.github/workflows/stage_cot.yml'
      - 'outils/stage/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-cot
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          mkdir -p /tmp/out/travail
      - name: Ballon de foot d'Ultimate (item/soccerball) dans des mods
        run: |
          set +e +o pipefail
          for q in "soccer ball" "soccerball" "soccer ball item" "ball item"; do
            python3 -u outils/stage/gb_fetch.py cherche "$q" item/soccerball /tmp/sb 6 2>&1 | tail -3
          done
          mkdir -p /tmp/out/sb
          find /tmp/sb -type d -path "*item/soccerball" -print0 | while IFS= read -r -d '' d; do
            n=$(echo "$d" | md5sum | cut -c1-6); mkdir -p /tmp/out/sb/$n; cp -r "$d" /tmp/out/sb/$n/; echo "$d" > /tmp/out/sb/$n/source.txt
            echo "== $n $(find "$d" -type f | wc -l) fichiers ($d)"; find "$d" -type f | sed "s#$d/##" | head -20
          done
          du -sh /tmp/out; true
      - name: Chiffrer et publier (branche sortie_stage_cot)
        if: always()
        run: |
          mkdir -p /tmp/pub; openssl rand -out /tmp/k.bin 32
          tar cz -C /tmp/out . | openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin > /tmp/pub/out.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey $GITHUB_WORKSPACE/cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc
          cd /tmp/pub && git init -q -b s && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "stage cot ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" s:sortie_stage_cot
