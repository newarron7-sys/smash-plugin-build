name: Stage COT (usage perso, sortie chiffree)
on:
  push:
    branches: [ stage_cot ]
    paths:
      - '.github/workflows/stage_cot.yml'
      - 'outils/stage/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-cot
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          mkdir -p /tmp/out/travail
      - name: HDR (lvd de la Destination Finale)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e +o pipefail
          mkdir -p /tmp/hdr && cd /tmp/hdr
          for repo in HDR-Development/HewDraw-Remix HDR-Development/romfs-release; do
            gh release view -R $repo --json tagName,assets -q '.tagName, (.assets[] | .name + " " + (.size|tostring))'
            gh release download -R $repo -p "*.zip" -D $repo 2>&1 | tail -2
          done
          find . -name "*.zip" | while read z; do unzip -l "$z" | grep -i "\.lvd" | head -40; unzip -qo "$z" "*end_00.lvd" "*stage/end/*" -d x 2>/dev/null; done
          find x -iname "*.lvd" | head
          find x -iname "end_00.lvd" -print0 | while IFS= read -r -d '' f; do n=$(md5sum "$f" | cut -c1-8); cp "$f" /tmp/out/travail/end_$n.lvd; echo "$f" > /tmp/out/travail/end_$n.txt; echo "== $n $f"; done
          true
      - name: Chiffrer et publier (branche sortie_stage_cot)
        if: always()
        run: |
          mkdir -p /tmp/pub; openssl rand -out /tmp/k.bin 32
          tar cz -C /tmp/out . | openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin > /tmp/pub/out.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey $GITHUB_WORKSPACE/cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc
          cd /tmp/pub && git init -q -b s && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "stage cot ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" s:sortie_stage_cot
