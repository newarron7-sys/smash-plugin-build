name: Stage COT (usage perso, sortie chiffree)
on:
  push:
    branches: [ stage_cot ]
    paths:
      - '.github/workflows/stage_cot.yml'
      - 'outils/stage/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-cot
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          mkdir -p /tmp/out/travail
      - name: HDR - mecanique des variantes de terrain (L)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e +o pipefail
          mkdir -p /tmp/hdr && cd /tmp/hdr
          gh release download -R HDR-Development/HewDraw-Remix -p "hdr-switch.zip" -D . 2>&1 | tail -2
          ls -la
          unzip -l hdr-switch.zip | grep -i -E "\.nro|stage_alt|alts|s01|config\.json|battlefield" | head -80
          unzip -l hdr-switch.zip | awk '{print $4}' | grep -i -E "/stage/" | sed -E 's#(stage/[^/]+/[^/]+)/.*#\1#' | sort | uniq -c | head -60
          mkdir -p /tmp/out/hdr
          unzip -l hdr-switch.zip > /tmp/out/hdr/liste.txt
          unzip -qo hdr-switch.zip "*config.json" "*.toml" "*stage/battlefield/*" -d /tmp/out/hdr/x 2>/dev/null
          find /tmp/out/hdr/x -name "*.nutexb" -delete
          du -sh /tmp/out/hdr
          true
      - name: Chiffrer et publier (branche sortie_stage_cot)
        if: always()
        run: |
          mkdir -p /tmp/pub; openssl rand -out /tmp/k.bin 32
          tar cz -C /tmp/out . | openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin > /tmp/pub/out.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey $GITHUB_WORKSPACE/cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc
          cd /tmp/pub && git init -q -b s && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "stage cot ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" s:sortie_stage_cot
