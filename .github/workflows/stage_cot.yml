name: Stage COT (usage perso, sortie chiffree)
on:
  push:
    branches: [ stage_cot ]
    paths:
      - '.github/workflows/stage_cot.yml'
      - 'outils/stage/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-cot
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          mkdir -p /tmp/out/travail
      - name: Grand Champ de bataille (stage/battlefield_l) dans des mods
        run: |
          set +e +o pipefail
          for q in "big battlefield" "big battlefield stage" "battlefield l" "large battlefield"; do
            python3 -u outils/stage/gb_fetch.py cherche "$q" stage/battlefield_l /tmp/bl 8 2>&1 | tail -3
          done
          find /tmp/bl -type d -path "*stage/battlefield_l" -print0 | while IFS= read -r -d '' d; do
            id=$(echo "$d" | sed -E 's#/tmp/bl/([0-9]+)/.*#\1#'); n=$(echo "$d" | md5sum | cut -c1-6)
            mkdir -p "/tmp/out/travail/bl_${id}_$n" && cp -r "$d" "/tmp/out/travail/bl_${id}_$n/"
            echo "$d" > "/tmp/out/travail/bl_${id}_$n/source.txt"
            find "$d" -type f | sed "s#$d/##" | sort > "/tmp/out/travail/bl_${id}_$n/liste.txt"
            echo "== bl $id $n : $(wc -l < "/tmp/out/travail/bl_${id}_$n/liste.txt") fichiers, lvd $(grep -c lvd "/tmp/out/travail/bl_${id}_$n/liste.txt") ($d)"
          done
          find /tmp/out/travail -name "*.nutexb" -delete; du -sh /tmp/out
          true
      - name: Chiffrer et publier (branche sortie_stage_cot)
        if: always()
        run: |
          mkdir -p /tmp/pub; openssl rand -out /tmp/k.bin 32
          tar cz -C /tmp/out . | openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin > /tmp/pub/out.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey $GITHUB_WORKSPACE/cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc
          cd /tmp/pub && git init -q -b s && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "stage cot ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" s:sortie_stage_cot
