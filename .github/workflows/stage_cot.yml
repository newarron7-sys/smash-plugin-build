name: Stage COT (usage perso, sortie chiffree)
on:
  push:
    branches: [ stage_cot ]
    paths:
      - '.github/workflows/stage_cot.yml'
      - 'outils/stage/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-cot
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          mkdir -p /tmp/out/travail
      - name: References Ultimate Destination Finale (stage/end) dans des mods
        run: |
          for q in "final destination" "final destination stage" "omega" "final destination replacement" "fd"; do
            python3 -u outils/stage/gb_fetch.py cherche "$q" stage/end/normal/model /tmp/fd 6 2>&1 | tail -4 || true
          done
          for q in "final destination" "final destination walk off" "final destination collision"; do
            python3 -u outils/stage/gb_fetch.py cherche "$q" stage/end/normal/param /tmp/fdp 6 2>&1 | tail -3 || true
          done
          find /tmp/fd /tmp/fdp -type d -path "*stage/end" -print0 2>/dev/null | while IFS= read -r -d '' d; do
            id=$(echo "$d" | sed -E 's#/tmp/fdp?/([0-9]+)/.*#\1#'); n=$(echo "$d" | md5sum | cut -c1-6)
            mkdir -p "/tmp/out/travail/fd_${id}_$n" && cp -r "$d" "/tmp/out/travail/fd_${id}_$n/"
            echo "$d" > "/tmp/out/travail/fd_${id}_$n/source.txt"
            find "$d" -type f | sed "s#$d/##" | sort > "/tmp/out/travail/fd_${id}_$n/liste.txt"
            echo "== fd $id $n : $(wc -l < "/tmp/out/travail/fd_${id}_$n/liste.txt") fichiers ($d)"
          done
          find /tmp/out/travail -name "*.nutexb" -delete; du -sh /tmp/out
          mkdir -p /tmp/out/ui
          find /tmp/fd /tmp/fdp -ipath "*ui/replace*/stage/stage_*" -iname "stage_*_end.bntx" -type f -print0 | while IFS= read -r -d '' f; do
            n=$(echo "$f" | md5sum | cut -c1-6); mkdir -p /tmp/out/ui/$n; cp "$f" /tmp/out/ui/$n/; echo "$f" > /tmp/out/ui/$n/source.txt; echo "== ui $n $f"
          done
      - name: Chiffrer et publier (branche sortie_stage_cot)
        if: always()
        run: |
          mkdir -p /tmp/pub; openssl rand -out /tmp/k.bin 32
          tar cz -C /tmp/out . | openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin > /tmp/pub/out.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey $GITHUB_WORKSPACE/cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc
          cd /tmp/pub && git init -q -b s && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "stage cot ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" s:sortie_stage_cot
