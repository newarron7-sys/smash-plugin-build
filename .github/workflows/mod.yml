name: Recuperer un mod (chiffre)
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/mod.yml' ]
permissions:
  contents: write
jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOD: "338954"
    steps:
      - name: Telecharger, extraire, chiffrer (rien n'est affiche)
        env:
          CLE: ${{ secrets.CLE }}
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          mkdir -p /tmp/m /tmp/out && cd /tmp/m
          if [ "${MOD%%:*}" = "cherche" ]; then
            # recherche d'un mod qui contient une banque de sons du perso (modèle de banque), arborescences des archives
            python3 - "${MOD#cherche:}" <<'PY' > /tmp/m/recherche.txt 2>&1 || true
          import json, sys, urllib.request, urllib.parse
          q = sys.argv[1]
          def get(u):
              r = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
              return json.load(urllib.request.urlopen(r, timeout=60))
          vus = set()
          for terme in (q.split('|') if '|' in q else [q + ' sound', q + ' sfx', q + ' voice', q]):
              for page in (1, 2, 3):
                  u = 'https://gamebanana.com/apiv11/Util/Search/Results?_sModelName=Mod&_sOrder=best_match&_idGameRow=6498&_sSearchString=%s&_nPage=%d&_nPerpage=50' % (urllib.parse.quote(terme), page)
                  try:
                      res = get(u).get('_aRecords', [])
                  except Exception as e:
                      print('ERR', e); break
                  print('RECH', terme, page, len(res))
                  for m in res:
                      i = m['_idRow']
                      if i in vus: continue
                      vus.add(i)
                      print('NOM', i, m.get('_sName'), (m.get('_aRootCategory') or {}).get('_sName'))
                      continue
                      try:
                          prof = get('https://gamebanana.com/apiv11/Mod/%d/ProfilePage' % i)
                      except Exception:
                          continue
                      for f in prof.get('_aFiles', []):
                          try:
                              tree = json.dumps(get('https://gamebanana.com/apiv11/File/%d' % f['_idRow']).get('_aMetadata', {}))
                          except Exception:
                              tree = ''
                          if len(vus) < 3:
                              print('EX', i, tree[:300])
                          if 'se_%s' % q in tree:
                              print('MOD', i, f['_idRow'], f.get('_nFilesize'), m.get('_sName'))
          PY
            cp /tmp/m/recherche.txt /tmp/out/ ; cd /tmp/out && printf '%s' "$CLE" > /tmp/k && openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k -in recherche.txt -out recherche.txt.enc && rm -f recherche.txt /tmp/k && exit 0
          fi
          # fiche du mod (nom, mises à jour, fichiers) puis tous ses fichiers ; rien n'est affiché
          curl -sSL -A "Mozilla/5.0" -o info.json "https://gamebanana.com/apiv11/Mod/$MOD/ProfilePage" || true
          curl -sSL -A "Mozilla/5.0" -o maj.json "https://gamebanana.com/apiv11/Mod/$MOD/Updates?_nPage=1&_nPerpage=20" || true
          mkdir -p x
          cp info.json maj.json x/ 2>/dev/null || true
          python3 - <<'PY' > liens.txt
          import json
          d=json.load(open('info.json'))
          for f in d.get('_aFiles',[]):
              print(f['_idRow'], f['_sDownloadUrl'])
          PY
          while read id url; do
            curl -sSL -A "Mozilla/5.0" -o "f_$id.bin" "$url"
            7z x -y -o"x/f_$id" "f_$id.bin" >/dev/null 2>&1 || true
          done < liens.txt
          echo "fichiers extraits : $(find x -type f | wc -l)"
          tar czf /tmp/mod.tgz -C /tmp/m x
          printf '%s' "$CLE" > /tmp/k
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k -in /tmp/mod.tgz | split -b 90m - /tmp/out/mod.tgz.enc.
          rm -f /tmp/k
      - name: Publier (branche mod, chiffre)
        run: |
          cd /tmp/out && git init -q -b mod && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "mod $MOD chiffre"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" mod
