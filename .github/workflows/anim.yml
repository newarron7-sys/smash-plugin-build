name: Animations (chiffre)
on:
  push:
    branches: [ main ]
    paths: [ 'donnees/anim.tgz.enc' ]
permissions:
  contents: write
jobs:
  anim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retarget (rien n'est affiche)
        env:
          CLE: ${{ secrets.CLE }}
        run: |
          pip install -q ssbh_data_py numpy scipy pillow >/dev/null 2>&1; python -c "import ssbh_data_py as S; print('ssbh', getattr(S,'__version__','?'), hasattr(S,'anim_data'))"
          printf '%s' "$CLE" > /tmp/k
          mkdir -p /tmp/a /tmp/out /tmp/pub
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/k -in donnees/anim.tgz.enc | tar xz -C /tmp/a
          bash /tmp/a/run.sh || true
          tail -3 /tmp/out/anim.txt | grep -oE '^[A-Za-z]+Error' || true
          echo "animations : $(ls /tmp/out/motion | wc -l)"
          tar cz -C /tmp/out . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k -out /tmp/pub/anim.tgz.enc
          rm -f /tmp/k
      - name: Publier (branche anim, chiffre)
        run: |
          cd /tmp/pub && git init -q -b anim && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m anim
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" anim
