name: Stage - Monster Hunter Tri Basin 1 sur Chateau de Suzaku (usage perso) - analyse
on:
  push:
    branches: [ marioults ]
    paths:
      - '.github/workflows/stage-mh.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-mh
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      BRAWL_CHR0: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar unrar fonts-dejavu-core >/dev/null 2>&1 || true
          pip install ssbh_data_py numpy pillow scipy pyyaml gdown >/dev/null
          mkdir -p /tmp/out/travail /tmp/out/refs /tmp/out/lvd
      - name: Pack de stages (Google Drive) et Basin 1
        run: |
          set +e
          mkdir -p /tmp/pack && cd /tmp/pack
          gdown 1RQbtMsA21CzJfrziyVpGWUxUthrTBEBi -O pack.zip > /tmp/out/gdown.txt 2>&1
          ls -la pack.zip | awk '{print $5}'
          7z l -ba -slt pack.zip | grep "^Path = " | sed 's/^Path = //' > /tmp/out/pack_liste.txt; wc -l < /tmp/out/pack_liste.txt
          7z x -y -ox pack.zip > /dev/null 2>&1
          find x -type f \( -iname "*.zip" -o -iname "*.rar" -o -iname "*.7z" \) -print0 | while IFS= read -r -d '' a; do 7z x -y -o"${a%.*}_x" "$a" > /dev/null 2>&1; done
          find x -type f | sed 's#^x/##' > /tmp/out/pack_tout.txt; wc -l < /tmp/out/pack_tout.txt
          cp "$(find x -path "*Basin1/STGFINAL.pac" | head -1)" /tmp/out/travail/STGFINAL_basin1.pac
          ls /tmp/out/travail | grep -c "\.pac$"
      - name: Analyse de Basin 1 (modeles, collisions)
        run: |
          set +e
          python3 -u outils/stagekit/stage/tools/brawl_coll.py /tmp/out/travail/STGFINAL_basin1.pac > /tmp/out/travail/collisions_basin1.txt 2>&1
          wc -l < /tmp/out/travail/collisions_basin1.txt
      - name: Infinite Azure (356866, reference grand stage) et refs du Chateau de Suzaku
        run: |
          set +e
          python3 -u outils/stagekit/stage/tools/gb_fetch.py mod 356866 /tmp/ia > /tmp/out/refs/ia_fichiers.txt 2>&1
          find /tmp/ia -type f | sed 's#/tmp/ia/##' > /tmp/out/refs/ia_tout.txt
          for q in "suzaku castle" "suzaku" "suzaku castle retexture"; do
            python3 -u outils/stagekit/stage/tools/gb_fetch.py cherche "$q" stage/ /tmp/ref 6 > /dev/null 2>&1
          done
          find /tmp/ref -type f | sed 's#/tmp/ref/##' > /tmp/out/refs/suzaku_tout.txt
          find /tmp/ref -maxdepth 4 -name "config.json" -print0 | while IFS= read -r -d '' c; do id=$(echo "$c" | sed -E 's#/tmp/ref/([0-9]+)/.*#\1#'); cp "$c" "/tmp/out/refs/config_$id.json"; done
          wc -l /tmp/out/refs/*.txt
      - name: lvd en yaml (Infinite Azure, refs, HDR)
        run: |
          set +e
          cargo install smash-lvd --features cli --root /tmp/lvdtool >/dev/null 2>&1
          mkdir -p /tmp/hdr && cd /tmp/hdr
          curl -sSL -o sp.zip https://github.com/HDR-Development/hdr-prereleases/releases/download/v0.50.10/switch-package.zip
          unzip -l sp.zip | awk '{print $4}' | grep "hdr-stages/stage/" | cut -d/ -f5 | sort -u > /tmp/out/lvd/hdr_stages.txt
          unzip -qo sp.zip "*hdr-stages/stage/*" -d x 2>/dev/null
          find /tmp/ia /tmp/ref /tmp/hdr/x -iname "*.lvd" -print0 | while IFS= read -r -d '' f; do
            n=$(echo "$f" | md5sum | cut -c1-8); echo "$f" > /tmp/out/lvd/$n.txt
            /tmp/lvdtool/bin/yamlvd "$f" /tmp/out/lvd/$n.yml > /dev/null 2>&1
          done
          ls /tmp/out/lvd | wc -l
      - name: Materiau modele (Yoshi's Story 392643, bg2_set)
        run: |
          python3 -u outils/stagekit/stage/tools/gb_fetch.py mod 392643 /tmp/ys > /dev/null 2>&1
          find /tmp/ys -path "*normal/model/bg2_set/model.numatb" | head -1 > /tmp/matl_modele.txt; wc -l < /tmp/matl_modele.txt
      - name: Cache ultimate_tex_cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ultimate_tex_cli
          key: ultimate-tex-cli-v1
      - name: ultimate_tex_cli
        run: test -x ~/.cargo/bin/ultimate_tex_cli || cargo install --locked --git https://github.com/ScanMountGoat/ultimate_tex ultimate_tex_cli 2>&1 | tail -2
      - name: Cache textures HD (x4)
        uses: actions/cache@v4
        with:
          path: /tmp/hd
          key: mh-hd-x4-v1
      - name: Textures HD x4 (Real-ESRGAN x4plus)
        env:
          PP_Y0: '0.1'
          PP_ECHELLE: '1.0'
        run: |
          set -o pipefail
          if [ ! -f /tmp/hd/fini ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision >/dev/null
            pip install spandrel >/dev/null
            curl -sSL -o /tmp/esr.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
            mkdir -p /tmp/hd
            python3 -u outils/stagekit/stage/tools/pp_scene.py textures /tmp/out/travail/STGFINAL_basin1.pac /tmp/hdsrc > /dev/null 2>&1
            for f in /tmp/hdsrc/*.png; do b=$(basename "$f" .png); python3 -u outils/stagekit/stage/tools/upscale_tex.py /tmp/esr.pth "$f" "/tmp/hd/${b}_x4.png" > /dev/null; done
            touch /tmp/hd/fini
          fi
          ls /tmp/hd | wc -l
      - name: Construction (Basin 1 sur le Chateau de Suzaku)
        run: |
          set -o pipefail
          export PATH=$PATH:/tmp/lvdtool/bin:$HOME/.cargo/bin
          REF=$(find /tmp/ref/379012 -type d -path "*stage/sf_suzaku" | head -1)
          NU=$(find /tmp/ref/348709 -type d -path "*stage/sf_suzaku" | head -1)
          LVD=$(find /tmp/hdr/x -path "*hdr-stages/stage/sf_suzaku/normal/param/streetfighter_f00.lvd" | head -1)
          M="/tmp/out/mod/(Stage) MH Tri Basin 1 (Suzaku)"
          mkdir -p "$M"
          MH_HD=/tmp/hd MH_SCENE=/tmp/rendu python3 -u outils/stagekit/stage/tools/mh_sz.py /tmp/out/travail/STGFINAL_basin1.pac "$REF" "$NU" "$(cat /tmp/matl_modele.txt)" "$LVD" "$M" > /tmp/out/construction.txt 2>&1
          tail -3 /tmp/out/construction.txt | cut -c1-60
          find "$M" -type f | sed "s#$M/##" | sort > /tmp/out/mod_liste.txt; wc -l < /tmp/out/mod_liste.txt; du -sh "$M"
      - name: Image de l'ecran des terrains
        env:
          PP_Y0: '0.1'
          PP_ECHELLE: '1.0'
          UI_NOM: sf_suzaku
          UI_CAM: '0,60,420,0,40,0,35,50'
          UI_FOND: '9ab8d8'
        run: |
          set +e
          export PATH=$PATH:$HOME/.cargo/bin
          npm i --prefix /tmp/rn three@0.160.0 playwright@1.47.2 >/dev/null 2>&1
          (cd /tmp/rn && npx playwright install --with-deps chromium >/dev/null 2>&1)
          R=/tmp/rendu; mkdir -p $R; cp outils/stagekit/stage/tools/rendu/* $R/; cp /tmp/rn/node_modules/three/build/three.module.js $R/
          ls $R/scene.json
          (cd $R && nohup python3 -m http.server 8765 >/dev/null 2>&1 &); sleep 3
          mkdir -p /tmp/refui; find /tmp/ref/582565 -ipath "*ui/replace*/stage/stage_*" -name "stage_*_sf_suzaku.bntx" -exec cp {} /tmp/refui/ \; ; ls /tmp/refui | wc -l
          M="/tmp/out/mod/(Stage) MH Tri Basin 1 (Suzaku)"
          NODE_PATH=/tmp/rn/node_modules python3 -u outils/stagekit/stage/tools/ui_pp.py $R /tmp/refui "$M/ui" /tmp/out/ui_apercu > /tmp/out/ui.txt 2>&1
          grep -c "greffé" /tmp/out/ui.txt
          # aperçus caméra reculée (comme quand les persos sont éloignés), vue de face et un peu de haut
          (cd $R && NODE_PATH=/tmp/rn/node_modules UI_FOND=9ab8d8 node rendu.js /tmp/out/apercu_recule.png 1280 720 0 80 700 0 40 0 40 > /dev/null 2>&1)
          (cd $R && NODE_PATH=/tmp/rn/node_modules UI_FOND=9ab8d8 node rendu.js /tmp/out/apercu_recule_bas.png 1280 720 700 120 1500 700 40 0 40 > /dev/null 2>&1)
          ls /tmp/out/apercu_recule*.png
          true
      - name: Chiffrer (cle de la session) et publier
        if: always()
        run: |
          mkdir -p /tmp/pub; tar cz -C /tmp/out . > /tmp/o.tgz
          openssl rand -hex 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/o.tgz | split -b 90m - /tmp/pub/out.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/o.tgz
          cd /tmp/pub && git init -q -b sortie_mh && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "mh" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sortie_mh
