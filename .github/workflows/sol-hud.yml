name: Plugin sol_hud (jauge de Tension de Sol dans le HUD)
on:
  push:
    branches: [ marioults ]
    paths:
      - 'solhud/**'
      - '.github/workflows/sol-hud.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sol-hud
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache outils (cargo-skyline, toolchain Switch)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-skyline
            ~/.cargo/skyline
            ~/.rustup/toolchains/*skyline*
            ~/.cargo/registry
            ~/.cargo/git
            solhud/target
          key: skyline-solhud-v1-${{ hashFiles('solhud/Cargo.toml') }}
          restore-keys: |
            skyline-solhud-v1-
            skyline-v1-
      - name: Compiler
        working-directory: solhud
        timeout-minutes: 45
        run: |
          command -v cargo-skyline >/dev/null || cargo install cargo-skyline
          if ! (rustup toolchain list | grep -qi skyline && [ -d ~/.cargo/skyline/toolchain ]); then for i in 1 2 3 4 5; do cargo skyline update-std && break; sleep 20; done; fi
          rm -f target/aarch64-skyline-switch/release/*.nro
          set +o pipefail; yes | CARGO_TERM_COLOR=never cargo skyline build --release 2>&1 | grep -E -B2 -A12 "^(error|warning: unused)" | head -150; set -o pipefail
          N=$(ls target/aarch64-skyline-switch/release/*.nro | head -1); test -s "$N"
          mkdir -p /tmp/out && cp "$N" /tmp/out/libsol_hud.nro && ls -l /tmp/out
      - name: Chiffrer (cle de la session) et publier
        if: always()
        run: |
          mkdir -p /tmp/pub /tmp/out; tar cz -C /tmp/out . > /tmp/o.tgz
          openssl rand -hex 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/o.tgz | split -b 90m - /tmp/pub/out.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/o.tgz
          cd /tmp/pub && git init -q -b sortie_solhud && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "solhud" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sortie_solhud
