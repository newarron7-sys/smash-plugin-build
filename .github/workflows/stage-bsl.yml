name: Stage - BSL Station Main Deck (GameBanana 406762, usage perso) sur Studio Wii Fit
on:
  push:
    branches: [ marioults ]
    paths:
      - '.github/workflows/stage-bsl.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-bsl
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      MID: '406762'
      BRAWL_CHR0: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar fonts-dejavu-core >/dev/null 2>&1 || true
          pip install ssbh_data_py numpy pillow scipy pyyaml >/dev/null
          mkdir -p /tmp/out/travail
      - name: Page du mod (description)
        run: |
          set +e
          curl -sSL -A "Mozilla/5.0" "https://gamebanana.com/apiv11/Mod/$MID/ProfilePage" -o /tmp/out/page.json
          python3 - <<'PY'
          import json, re, html
          p = json.load(open('/tmp/out/page.json'))
          t = re.sub(r'<[^>]+>', ' ', html.unescape(p.get('_sText', '') or ''))
          open('/tmp/out/page.txt', 'w').write('%s\n%s\n%s\n\n%s\n' % (p.get('_sName'), p.get('_aGame', {}).get('_sName'),
              p.get('_aCategory', {}).get('_sName'), re.sub(r'\s+', ' ', t)))
          print('page ok')
          PY
      - name: Telechargement
        run: |
          python3 -u outils/stagekit/stage/tools/gb_fetch.py mod $MID /tmp/gb > /tmp/out/fichiers.txt 2>&1; wc -l /tmp/out/fichiers.txt
          find /tmp/gb/$MID -iname "*.pac" -print0 | while IFS= read -r -d '' f; do cp "$f" /tmp/out/travail/; done
          find /tmp/gb/$MID -iname "*.txt" -print0 | while IFS= read -r -d '' f; do echo "== $f"; head -60 "$f"; done > /tmp/out/lisezmoi.txt 2>&1
          ls /tmp/out/travail | wc -l
      - name: Analyse (modeles, collisions, apercu de face)
        run: |
          set +e
          for f in /tmp/out/travail/*.pac; do
            b=$(basename "$f" .pac)
            python3 -u outils/stagekit/stage/tools/analyse_brawl_stage.py "$f" /tmp/out/apercu_$b.png "$b" -56,56,0 > /tmp/out/analyse_$b.txt 2>&1
            python3 -u outils/stagekit/stage/tools/brawl_coll.py "$f" > /tmp/out/collisions_$b.txt 2>&1
            echo "=== $b $(wc -l < /tmp/out/analyse_$b.txt) $(wc -l < /tmp/out/collisions_$b.txt)"
          done
          true
      - name: References Ultimate du Studio Wii Fit (stage/wiifit)
        run: |
          set +e +o pipefail
          for q in "wii fit studio" "wii fit" "wiifit" "wii fit studio retexture"; do
            python3 -u outils/stagekit/stage/tools/gb_fetch.py cherche "$q" stage/wiifit /tmp/ref 6 > /dev/null 2>&1
          done
          ls /tmp/ref | tr '\n' ' '
          find /tmp/ref -type d -path "*stage/wiifit" -print0 2>/dev/null | while IFS= read -r -d '' d; do
            id=$(echo "$d" | sed -E 's#/tmp/ref/([0-9]+)/.*#\1#'); n=$(echo "$d" | md5sum | cut -c1-6)
            mkdir -p "/tmp/out/refs/ref_${id}_$n"
            echo "$d" > "/tmp/out/refs/ref_${id}_$n/source.txt"
            find "$d" -type f | sed "s#$d/##" | sort > "/tmp/out/refs/ref_${id}_$n/liste.txt"
            python3 outils/stagekit/stage/tools/inspect_ref.py "$d" > "/tmp/out/refs/ref_${id}_$n/inspect.txt" 2>&1
          done
          find /tmp/ref -maxdepth 4 -name "config.json" -print0 | while IFS= read -r -d '' c; do id=$(echo "$c" | sed -E 's#/tmp/ref/([0-9]+)/.*#\1#'); cp "$c" "/tmp/out/refs/config_$id.json"; done
          find /tmp/ref -ipath "*ui/replace*/stage/stage_*" -iname "*wiifit*" -type f > /tmp/out/refs/ref_ui.txt
          find /tmp/ref -type f -path "*stage/wiifit*" | sed 's#/tmp/ref/##' > /tmp/out/refs/tous.txt
          ls /tmp/out/refs | wc -l
          true
      - name: Collisions du Studio Wii Fit - refs + HDR, en yaml
        run: |
          set +e +o pipefail
          cargo install smash-lvd --features cli --root /tmp/lvdtool >/dev/null 2>&1; ls /tmp/lvdtool/bin
          mkdir -p /tmp/out/lvd /tmp/hdr && cd /tmp/hdr
          curl -sSL -o hdr.zip https://github.com/HDR-Development/HewDraw-Remix/releases/download/v0.50.10/hdr-switch.zip
          curl -sSL -o sp.zip https://github.com/HDR-Development/hdr-prereleases/releases/download/v0.50.10/switch-package.zip
          for z in hdr.zip sp.zip; do unzip -qo $z "*wiifit*" -d x_$z 2>/dev/null; done
          find /tmp/hdr -path "*wiifit*" -type f | sed 's#/tmp/hdr/##' > /tmp/out/lvd/hdr_fichiers.txt
          find /tmp/ref /tmp/hdr -ipath "*wiifit*" -iname "*.lvd" -print0 | while IFS= read -r -d '' f; do
            n=$(md5sum "$f" | cut -c1-8); cp "$f" /tmp/out/lvd/$n.lvd; echo "$f" > /tmp/out/lvd/$n.txt
            /tmp/lvdtool/bin/yamlvd "$f" /tmp/out/lvd/$n.yml >/dev/null 2>&1
          done
          ls /tmp/out/lvd | wc -l
          true
      - name: Materiau modele (Yoshi's Story 392643, bg2_set)
        run: |
          python3 -u outils/stagekit/stage/tools/gb_fetch.py mod 392643 /tmp/ys > /dev/null 2>&1
          find /tmp/ys -path "*normal/model/bg2_set/model.numatb" | head -1 > /tmp/matl_modele.txt; wc -l < /tmp/matl_modele.txt
      - name: Cache ultimate_tex_cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ultimate_tex_cli
          key: ultimate-tex-cli-v1
      - name: ultimate_tex_cli
        run: test -x ~/.cargo/bin/ultimate_tex_cli || cargo install --locked --git https://github.com/ScanMountGoat/ultimate_tex ultimate_tex_cli 2>&1 | tail -2
      - name: Cache textures HD (x4)
        uses: actions/cache@v4
        with:
          path: /tmp/hd
          key: bsl-hd-x4-v1
      - name: Textures HD x4 (Real-ESRGAN x4plus)
        env:
          PP_Y0: '0.0'
          PP_ECHELLE: '1.0'
        run: |
          set -o pipefail
          if [ ! -f /tmp/hd/fini ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision >/dev/null
            pip install spandrel >/dev/null
            curl -sSL -o /tmp/esr.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
            mkdir -p /tmp/hd
            python3 -u outils/stagekit/stage/tools/pp_scene.py textures /tmp/out/travail/STGBSLSTATION_FD.pac /tmp/hdsrc > /dev/null 2>&1
            for f in /tmp/hdsrc/*.png; do b=$(basename "$f" .png); python3 -u outils/stagekit/stage/tools/upscale_tex.py /tmp/esr.pth "$f" "/tmp/hd/${b}_x4.png" > /dev/null; done
            touch /tmp/hd/fini
          fi
          ls /tmp/hd | wc -l
      - name: Construction (BSL Station sur le Studio Wii Fit)
        run: |
          set -o pipefail
          export PATH=$PATH:/tmp/lvdtool/bin:$HOME/.cargo/bin
          REF=$(find /tmp/ref/319081 -type d -path "*stage/wiifit" | head -1)
          BK=$(find /tmp/ref/482979 -type d -path "*stage/wiifit" | head -1)
          MVC=$(find /tmp/ref/476217 -type d -path "*stage/wiifit" | head -1)
          LVD=$(find /tmp/hdr -path "*hdr-stages/stage/wiifit/normal/param/wiifit00.lvd" | head -1)
          M="/tmp/out/mod/(Stage) BSL Station Main Deck (Wii Fit)"
          mkdir -p "$M"
          BSL_HD=/tmp/hd BSL_SCENE=/tmp/rendu python3 -u outils/stagekit/stage/tools/bsl_wf.py /tmp/out/travail/STGBSLSTATION_FD.pac "$REF" "$BK" "$MVC" "$(cat /tmp/matl_modele.txt)" "$LVD" "$M" > /tmp/out/construction.txt 2>&1
          tail -3 /tmp/out/construction.txt | cut -c1-60
          find "$M" -type f | sed "s#$M/##" | sort > /tmp/out/mod_liste.txt; wc -l < /tmp/out/mod_liste.txt; du -sh "$M"
      - name: Image de l'ecran des terrains
        env:
          PP_Y0: '0.0'
          PP_ECHELLE: '1.0'
          UI_NOM: wiifit
          UI_CAM: '0,30,250,0,20,0,30,45'
          UI_FOND: '05060a'
        run: |
          set +e
          export PATH=$PATH:$HOME/.cargo/bin
          npm i --prefix /tmp/rn three@0.160.0 playwright@1.47.2 >/dev/null 2>&1
          (cd /tmp/rn && npx playwright install --with-deps chromium >/dev/null 2>&1)
          R=/tmp/rendu; mkdir -p $R; cp outils/stagekit/stage/tools/rendu/* $R/; cp /tmp/rn/node_modules/three/build/three.module.js $R/
          ls $R/scene.json
          (cd $R && nohup python3 -m http.server 8765 >/dev/null 2>&1 &); sleep 3
          mkdir -p /tmp/refui; find /tmp/ref/482979 -ipath "*ui/replace*/stage/stage_*" -name "stage_*_wiifit.bntx" -exec cp {} /tmp/refui/ \; ; ls /tmp/refui | wc -l
          M="/tmp/out/mod/(Stage) BSL Station Main Deck (Wii Fit)"
          NODE_PATH=/tmp/rn/node_modules python3 -u outils/stagekit/stage/tools/ui_pp.py $R /tmp/refui "$M/ui" /tmp/out/ui_apercu > /tmp/out/ui.txt 2>&1
          grep -c "greffé" /tmp/out/ui.txt
          # aperçus caméra reculée (comme quand les persos sont éloignés), vue de face et un peu de haut
          (cd $R && NODE_PATH=/tmp/rn/node_modules UI_FOND=05060a node rendu.js /tmp/out/apercu_recule.png 1280 720 0 35 330 0 20 0 40 > /dev/null 2>&1)
          (cd $R && NODE_PATH=/tmp/rn/node_modules UI_FOND=05060a node rendu.js /tmp/out/apercu_recule_bas.png 1280 720 0 15 380 0 0 0 40 > /dev/null 2>&1)
          ls /tmp/out/apercu_recule*.png
          true
      - name: Chiffrer (cle de la session) et publier
        if: always()
        run: |
          mkdir -p /tmp/pub; tar cz -C /tmp/out . > /tmp/o.tgz
          openssl rand -hex 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/o.tgz | split -b 90m - /tmp/pub/out.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/o.tgz
          cd /tmp/pub && git init -q -b sortie_bsl && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "bsl" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sortie_bsl
