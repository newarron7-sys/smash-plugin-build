name: Mach Rider - sons (vc_captain_c190, sortie chiffree)
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/mr_sons.yml', 'outils/machrider/*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sons:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Ondes du mod (branche sons, dechiffrees ici)
        env:
          CLE: ${{ secrets.CLE }}
        run: |
          printf '%s' "$CLE" > /tmp/k
          git fetch -q origin sons && git show origin/sons:sons.tgz.enc > /tmp/sons.enc
          mkdir -p /tmp/sons && openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/k -in /tmp/sons.enc | tar xz -C /tmp/sons
          echo "ondes : $(ls /tmp/sons/21C/*.idsp | wc -l)"
      - name: Modele vc_captain (GameBanana)
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          python3 outils/fancy/template.py /tmp/tpl captain "captain falcon voice,captain falcon voice pack,captain falcon voice replacement,falcon voice,captain falcon sound" > /tmp/modele.txt 2>&1 || true
          grep -E "CHOISI|AUCUN" /tmp/modele.txt | head -3
          PREFIXE=se python3 outils/fancy/template.py /tmp/tpl captain "captain falcon sound effects,captain falcon sfx,captain falcon sounds,falcon sfx,captain falcon sound,captain falcon skin sound,captain falcon voice and sfx,falcon sound effects" > /tmp/modele_se.txt 2>&1 || true
          grep -E "CHOISI|AUCUN" /tmp/modele_se.txt | head -3
      - name: Mods de Falcon avec sons sur case ajoutee (Slayer...)
        run: |
          python3 outils/machrider/cherche_mod.py /tmp/out_mods captain "slayer captain falcon,slayer guilty gear,saitama captain falcon,akaza captain falcon,blood falcon" > /tmp/cherche.txt 2>&1 || true
          grep -cE "MOD avec sons" /tmp/cherche.txt || true
      - name: Construire et publier (branche sortie_mr_sons, chiffree)
        run: |
          mkdir -p /tmp/out
          C=outils/machrider/carte_vc.json; [ -f "$C" ] || C=""
          python3 outils/machrider/build_vc_mr.py /tmp/sons/21C /tmp/tpl/vc_captain_modele.nus3audio /tmp/out/vc_captain_c190.nus3audio $C vc > /tmp/out/build.txt 2>&1 || true
          cp /tmp/modele.txt /tmp/modele_se.txt /tmp/cherche.txt /tmp/out/ 2>/dev/null || true
          cp -r /tmp/out_mods /tmp/out/mods 2>/dev/null || true
          mkdir -p /tmp/out/banques && cp /tmp/tpl/*.nus3bank.* /tmp/out/banques/ 2>/dev/null || true
          [ -f /tmp/tpl/se_captain_modele.nus3audio ] && python3 outils/nus3.py /tmp/tpl/se_captain_modele.nus3audio > /tmp/out/se_pistes.txt 2>&1 || true
          python3 outils/machrider/build_vc_mr.py /tmp/sons/21C /tmp/tpl/se_captain_modele.nus3audio /tmp/out/se_captain_c190.nus3audio outils/machrider/carte_vc.json se > /tmp/out/build_se.txt 2>&1 || true
          tail -1 /tmp/out/build_se.txt | grep -oE "ok [0-9]+ pistes" || echo "echec se"
          tail -1 /tmp/out/build.txt | grep -oE "ok [0-9]+ pistes" || echo "echec"
          tar cz -C /tmp/out . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k -out /tmp/mr_sons.tgz.enc
          rm -f /tmp/k
          mkdir -p /tmp/pub && cp /tmp/mr_sons.tgz.enc /tmp/pub/ && cd /tmp/pub
          git init -q -b sortie_mr_sons && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m sons
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" sortie_mr_sons
