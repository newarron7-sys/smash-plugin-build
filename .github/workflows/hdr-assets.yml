name: HDR - recuperer les animations/params de Bowser (0.50 pre-release, chiffre)
on:
  push:
    branches: [ marioults ]
    paths: [ '.github/workflows/hdr-assets.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger le paquet complet HDR v0.50.10 (pre-release) + source au meme tag
        run: |
          mkdir -p /tmp/o/x /tmp/dl && cd /tmp/dl
          curl -sSL -o sp.zip https://github.com/HDR-Development/hdr-prereleases/releases/download/v0.50.10/switch-package.zip
          curl -sSL -o /tmp/o/content_hashes.txt https://github.com/HDR-Development/hdr-prereleases/releases/download/v0.50.10/content_hashes.txt
          curl -sSL -o /tmp/o/CHANGELOG.md https://github.com/HDR-Development/hdr-prereleases/releases/download/v0.50.10/CHANGELOG.md
          unzip -l sp.zip > /tmp/o/liste_sp.txt
          unzip -q -o sp.zip -d /tmp/o/x '*koopa*' '*fighter/common/*' 'ultimate/mods/*/config.json' '*hdr_version*' '*/plugin.nro' || true
          git clone -q --depth 1 -b v0.50.10 https://github.com/HDR-Development/HewDraw-Remix /tmp/src && git -C /tmp/src log -1 --format="%H %ci" > /tmp/o/src_commit.txt
          tar cz -C /tmp/src --exclude=.git . > /tmp/o/src_v0.50.10.tgz
          find /tmp/o/x -type f | wc -l; du -sh /tmp/o
      - name: Chiffrer (cle de la session) et publier
        run: |
          mkdir -p /tmp/pub; tar cz -C /tmp/o . > /tmp/o.tgz
          openssl rand -hex 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/o.tgz | split -b 90m - /tmp/pub/out.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/o.tgz
          cd /tmp/pub && git init -q -b sortie_hdr_assets && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "hdr assets" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sortie_hdr_assets
