name: REX - Primid (reference Mario, sortie chiffree pour la session)
on:
  push:
    branches: [ primid ]
    paths: [ '.github/workflows/rex_primid.yml' ]
permissions:
  contents: write
jobs:
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Outils
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          pip install ssbh_data_py numpy >/dev/null && python3 -c 'import ssbh_data_py; print("ssbh_data_py ok")'
      - name: Modele de reference de Mario (skins GameBanana, squelette le plus courant)
        env:
          MAJORITE: '6'
        run: |
          python3 outils/primid/ref_fighter.py mario "Mario" /tmp/ref > /tmp/ref_log.txt 2>&1 || true
          tail -40 /tmp/ref_log.txt
          test -f /tmp/ref/ref/model.nusktb && echo reference ok
      - name: Chiffrer et publier (branche sortie_primid_ref)
        run: |
          mkdir -p /tmp/pub && cp /tmp/ref_log.txt /tmp/ref/
          openssl rand -out /tmp/k.bin 32
          tar cz -C /tmp/ref . | openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin | split -b 90m - /tmp/pub/ref.tgz.enc.
          openssl pkeyutl -encrypt -pubin -inkey $GITHUB_WORKSPACE/cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc
          rm -f /tmp/k.bin
          cd /tmp/pub && git init -q -b s && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "reference Mario chiffree"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" s:sortie_primid_ref
