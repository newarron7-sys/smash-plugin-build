name: Stage Brawl Planet Papetoon (GameBanana 395060, chiffre)
on:
  push:
    branches: [ marioults ]
    paths: [ '.github/workflows/stage_papetoon.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger et lister (meme methode que Stage COT)
        run: |
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
          mkdir -p /tmp/out
          curl -sL "https://gamebanana.com/apiv11/Mod/395060?_csvProperties=_sName,_sText,_sVersion" | python3 -c "import json,sys,re,html;d=json.load(sys.stdin);print(d.get('_sName'));print(html.unescape(re.sub('<[^>]+>','\n',d.get('_sText',''))))" > /tmp/out/description.txt
          python3 -u outils/stage/gb_fetch.py mod 395060 /tmp/pp 2>&1 | tee /tmp/out/telechargement.txt | head -20
          find /tmp/pp -type f | grep -v archives | sed 's#/tmp/pp/##' > /tmp/out/liste.txt; wc -l /tmp/out/liste.txt
          mkdir -p /tmp/out/pp && find /tmp/pp -type f -not -path "*archives*" -not -iname "*.brstm" -print0 | while IFS= read -r -d '' f; do mkdir -p "/tmp/out/pp/$(dirname "${f#/tmp/pp/}")"; cp "$f" "/tmp/out/pp/${f#/tmp/pp/}"; done
          du -sh /tmp/out
      - name: Chiffrer (cle de la session) et publier
        run: |
          mkdir -p /tmp/pub; tar cz -C /tmp/out . > /tmp/o.tgz
          openssl rand -hex 32 > /tmp/k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/o.tgz | split -b 90m - /tmp/pub/out.session.enc.
          openssl pkeyutl -encrypt -pubin -inkey cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc; rm -f /tmp/k.bin /tmp/o.tgz
          cd /tmp/pub && git init -q -b sortie_papetoon && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "papetoon" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sortie_papetoon
