name: Primid - effets de Mario (ef_mario.eff, sortie chiffree)
on:
  push:
    branches: [ primid ]
    paths: [ '.github/workflows/primid_eff.yml', 'outils/primid/fetch_eff.py' ]
permissions:
  contents: write
jobs:
  eff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || true
      - name: ef_mario.eff (mods GameBanana, fichier le plus courant)
        run: |
          mkdir -p /tmp/eff
          python3 outils/primid/fetch_eff.py mario /tmp/eff > /tmp/eff/log.txt 2>&1 || true
          tail -30 /tmp/eff/log.txt
      - name: Chiffrer et publier (branche sortie_primid_eff)
        run: |
          mkdir -p /tmp/pub
          openssl rand -out /tmp/k.bin 32
          tar cz -C /tmp/eff . | openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin > /tmp/pub/eff.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey $GITHUB_WORKSPACE/cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/pub/k.session.enc
          rm -f /tmp/k.bin
          cd /tmp/pub && git init -q -b s && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "effets Mario chiffres"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" s:sortie_primid_eff
