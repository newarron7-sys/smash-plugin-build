name: Recuperer des fichiers du build REX (chiffre)
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/rex.yml' ]
permissions:
  contents: write
jobs:
  rex:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Place
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get install -y p7zip-full p7zip-rar >/dev/null 2>&1 || sudo apt-get install -y 7zip 7zip-rar >/dev/null 2>&1 || true; 7z | head -2
      - name: Build REX (Google Drive du proprietaire)
        run: |
          mkdir -p /tmp/w && cd /tmp/w
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          ID=1EpUZCpCQTMTYAtrnQCTBgvp6KUAsLo6-
          for essai in $(seq 1 30); do
            curl -sSL -c ck.txt -A "$UA" "https://drive.google.com/uc?export=download&id=$ID" -o page.html || true
            uuid=$(grep -oE 'name="uuid" value="[^"]+"' page.html | sed 's/.*value="//; s/"$//' || true)
            curl -sSL -b ck.txt -A "$UA" -o rex.rar "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t&uuid=$uuid" || true
            if [ "$(stat -c %s rex.rar)" -gt 1000000000 ]; then echo "Google Drive OK (essai $essai)"; break; fi
            echo "quota atteint (essai $essai), nouvel essai dans 10 min"; rm -f rex.rar; sleep 600
          done
          test -f rex.rar
          sd=$(7z l -ba -slt rex.rar | sed -n 's/^Path = \(.*sd\.raw\)$/\1/p' | head -1)
          echo "carte SD trouvee : $([ -n "$sd" ] && echo oui || echo non)"
          7z e -y rex.rar "$sd" -o/tmp/w >/dev/null; rm -f rex.rar; ls -la /tmp/w | grep -c "sd.raw"
      - name: Extraire (rien n'est affiche)
        env:
          CLE: ${{ secrets.CLE }}
        run: |
          cd /tmp/w && mkdir -p /tmp/x /tmp/pub
          7z l -ba -slt sd.raw | awk '/^Path = /{p=substr($0,8)} /^Size = /{print $3"\t"p}' > /tmp/x/liste_sd.txt
          7z x -y sd.raw "rex_/pf/Fighter/chief/*" "rex_/pf/module/ft_chief.rel" "rex_/pf/info/portrite/*" "rex_/pf/*/*/*hief*" "rex_/pf/*/*/*HIEF*" "rex_/pf/*/*hief*" "rex_/pf/sound/strm/Victory! 2/Master_Chief.brstm" -o/tmp/x >/dev/null || true
          # sons de Chief : fiches BrawlEx (numéro de banque de sons), puis la banque .sawnd de Chief
          7z x -y sd.raw "rex_/pf/BrawlEx/FighterConfig/*" -o/tmp/x >/dev/null || true
          python3 - > /tmp/x/banque.txt <<'PY'
          import os, struct, glob
          d = '/tmp/x/rex_/pf/BrawlEx/FighterConfig/'
          cfg = {os.path.basename(f): open(f, 'rb').read() for f in glob.glob(d + '*.dat')}
          sawnd = set(l.split('\t')[1].rsplit('/', 1)[1][:-6].upper() for l in open('/tmp/x/liste_sd.txt') if '/sfx/' in l and l.strip().endswith('.sawnd'))
          c = cfg.get('Fighter5B.dat', b'')
          print('Fighter5B', len(c), c[:64].hex())
          for o in range(0, len(c) - 1):
              for fmt in ('>H', '>I'):
                  if o + struct.calcsize(fmt) <= len(c):
                      v = struct.unpack_from(fmt, c, o)[0]
                      if '%03X' % v in sawnd and v > 0x10:
                          n1bb = sum(1 for x in cfg.values() if o + 4 <= len(x) and struct.unpack_from(fmt, x, o)[0] == 0x1BB)
                          print('CAND', o, fmt, '%03X' % v, 'autres fiches a 1BB a cet endroit :', n1bb)
          PY
          B=$(awk '/^CAND/ && $NF>0 {print $4}' /tmp/x/banque.txt | sort -u); [ -n "$B" ] || B=$(awk '/^CAND/ {print $4}' /tmp/x/banque.txt | sort -u | head -6)
          for b in $B; do 7z x -y sd.raw "rex_/pf/sfx/$b.sawnd" -o/tmp/x >/dev/null || true; done
          rm -f sd.raw
          echo "liste : $(wc -l < /tmp/x/liste_sd.txt) lignes"; echo "fichiers : $(find /tmp/x -type f | wc -l), taille : $(du -sh /tmp/x | cut -f1)"
          printf '%s' "$CLE" > /tmp/k
          tar cz -C /tmp/x . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k | split -b 90m - /tmp/pub/rex.tgz.enc.
          rm -f /tmp/k; ls /tmp/pub | wc -l
      - name: Publier (branche rex, chiffre)
        run: |
          cd /tmp/pub && git init -q -b rex && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "rex master chief chiffre"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" rex:rex_chief
