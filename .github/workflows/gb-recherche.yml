name: GameBanana - recherche de skins (noms publics)
on:
  push:
    branches: [ metalsonic ]
    paths: [ '.github/workflows/gb-recherche.yml' ]
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      Q: "Metal Sonic|Metal Sonic over Sonic|Neo Metal Sonic|Metal Sonic Sonic skin"
    steps:
      - run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          def get(u):
              r = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
              return json.load(urllib.request.urlopen(r, timeout=60))
          vus = set()
          for t in os.environ['Q'].split('|'):
              for page in (1, 2):
                  u = 'https://gamebanana.com/apiv11/Util/Search/Results?_sModelName=Mod&_sOrder=best_match&_idGameRow=6498&_sSearchString=%s&_nPage=%d&_nPerpage=50' % (urllib.parse.quote(t), page)
                  try: res = get(u).get('_aRecords', [])
                  except Exception as e: print('ERR', e); break
                  for m in res:
                      i = m['_idRow']
                      if i in vus or 'metal' not in m.get('_sName', '').lower(): continue
                      vus.add(i)
                      print('NOM', i, '|', m.get('_sName'), '|', (m.get('_aRootCategory') or {}).get('_sName'), '| likes', m.get('_nLikeCount'), '| vues', m.get('_nViewCount'), '|', m.get('_tsDateUpdated') or m.get('_tsDateAdded'))
          for i in sorted(vus):
              try:
                  p = get('https://gamebanana.com/apiv11/Mod/%d/ProfilePage' % i)
                  print('FICHE', i, '|', p.get('_sName'), '| fichiers', [(f['_idRow'], f.get('_sFile'), f.get('_nFilesize')) for f in p.get('_aFiles', [])][:4], '| desc', (p.get('_sDescription') or '')[:120])
              except Exception as e: print('ERRF', i, e)
          PY
