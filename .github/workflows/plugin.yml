name: Compilation du plugin (code seulement ; donnees chiffrees, sortie chiffree)
# branche supersonic-vol : Super Sonic compilé à part (ne touche ni main ni la branche sortie de Master Chief) ;
# sortie sur la branche sortie_supersonic, chiffrée aussi pour la clé publique de la session (cle_session.pem)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plugin-supersonic
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Donnees (dechiffrees seulement ici, jamais affichees)
        env:
          CLE: ${{ secrets.CLE }}
        run: |
          printf '%s' "$CLE" > /tmp/cle && openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/cle -in donnees/generated.rs.enc -out plugin/src/generated.rs && rm -f /tmp/cle
          test -s plugin/src/generated.rs
      - name: Cache outils (cargo-skyline, toolchain Switch)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-skyline
            ~/.cargo/skyline
            ~/.rustup/toolchains/*skyline*
            ~/.cargo/registry
            ~/.cargo/git
            plugin/target
          key: skyline-v1-${{ hashFiles('plugin/Cargo.toml') }}
          restore-keys: skyline-v1-
      - name: Compiler
        working-directory: plugin
        timeout-minutes: 40
        run: |
          command -v cargo-skyline >/dev/null || cargo install cargo-skyline
          if ! (rustup toolchain list | grep -qi skyline && [ -d ~/.cargo/skyline/toolchain ]); then for i in 1 2 3 4 5; do cargo skyline update-std && break; sleep 20; done; fi
          rm -f target/aarch64-skyline-switch/release/*.nro
          set +o pipefail; yes | CARGO_TERM_COLOR=never cargo skyline build --release 2>&1 | grep -E -A8 "error" | sed '/generated.rs/,+8d' | head -80; set -o pipefail
          N=$(ls target/aarch64-skyline-switch/release/*.nro | head -1); test -s "$N"
          rm -f src/generated.rs
          printf '%s' "$CLE" > /tmp/cle && openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/cle -in "$N" -out /tmp/plugin.nro.enc && rm -f /tmp/cle
          # copie pour la session : clé AES tirée au hasard, elle-même chiffrée avec la clé publique de la session
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in "$N" -out /tmp/plugin.session.enc
          openssl pkeyutl -encrypt -pubin -inkey ../cle_session.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/k.session.enc && rm -f /tmp/k.bin
        env:
          CLE: ${{ secrets.CLE }}
      - name: Sortie chiffree (branche sortie)
        run: |
          mkdir -p /tmp/sortie && cp /tmp/plugin.nro.enc /tmp/plugin.session.enc /tmp/k.session.enc /tmp/sortie/ && cd /tmp/sortie
          git init -q -b sortie_supersonic && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "plugin chiffre ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" sortie_supersonic
