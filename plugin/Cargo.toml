[package]
name = "master_chief"
version = "0.1.0"
edition = "2021"
description = "Master Chief (Super Smash Bros REX) sur Snake : portage (usage perso)"

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
crate-type = ["cdylib"]

[patch.crates-io]
nnsdk = { git = "https://github.com/ultimate-research/nnsdk-rs" }

[dependencies]
skyline = { git = "https://github.com/ultimate-research/skyline-rs" }
skyline_smash = { git = "https://github.com/ultimate-research/skyline-smash.git", features = ["weak_l2cvalue"] }
smash_script = { path = "../vendor/smash-script" }
smashline = { git = "https://github.com/HDR-Development/smashline", rev = "df194a03b918116adb7bda1c2b4565dcd82a4756" }


[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[workspace]
