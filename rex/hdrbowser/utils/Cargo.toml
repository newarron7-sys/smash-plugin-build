[package]
name = "utils"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
skyline = { git = "https://github.com/ultimate-research/skyline-rs" }
skyline_smash = { git = "https://github.com/ultimate-research/skyline-smash", features = ["weak_l2cvalue"] }
lazy_static = "1.4.0"
arcropolis-api = { git = "https://github.com/Raytwo/arcropolis_api" }
prc-rs = { git = "https://github.com/ultimate-research/prc-rs", rev = "c5855b8d0e910b1c3622c3131e6dfe0567d62397", features = ["indexmap-std", "xml-feat"] }
parking_lot = "0.11.2"
hdr-macros = { path = "../hdr-macros" }
utils-dyn = { package = "dynamic", path = "../dynamic" }
ninput = { git = "https://github.com/blu-dev/ninput", rev = "af26d4de5bb5f444985193b296ce65fe364e6a33" }
skyline-web = { git = "https://github.com/skyline-rs/skyline-web" }
smash_script = { path = "../vendor/smash-script" }
once_cell = "1.15.0"
colorgrad = "0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
interpolation = "0.2.0"

[features]
default = ["no-offset-search"]
no-offset-search = []
