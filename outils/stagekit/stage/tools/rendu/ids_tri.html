<!doctype html><html><body style="margin:0"><script type="module">
import * as THREE from './three.module.js';
const W=960,H=540;
const r=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});r.setSize(W,H);document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x000000);
const d=await (await fetch('scene.json')).json();
let base=1;
d.forEach((o,i)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(o.p,3));
 const nt=o.p.length/9;const col=new Float32Array(nt*9);
 for(let t=0;t<nt;t++){const id=base+t;for(let v=0;v<3;v++){col[t*9+v*3]=((id>>16)&255)/255;col[t*9+v*3+1]=((id>>8)&255)/255;col[t*9+v*3+2]=(id&255)/255;}}
 base+=nt;g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
 const m=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide,depthWrite:!o.a});
 m.color.convertLinearToSRGB?0:0; const me=new THREE.Mesh(g,m); me.renderOrder=o.a?1:0; sc.add(me);});
r.outputColorSpace=THREE.LinearSRGBColorSpace;
const cams=JSON.parse(new URLSearchParams(location.search).get('c'));
const gl=r.getContext();const px=new Uint8Array(W*H*4);const vus={};
for(const c of cams){const cam=new THREE.PerspectiveCamera(c[6],W/H,1,60000);cam.position.set(c[0],c[1],c[2]);cam.lookAt(c[3],c[4],c[5]);
 r.render(sc,cam);gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
 for(let k=0;k<px.length;k+=4){const id=(px[k]<<16)|(px[k+1]<<8)|px[k+2];if(id)vus[id]=(vus[id]||0)+1;}}
window.RES=vus;window.FINI=true;
</script></body></html>
